<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Renz I. Vertudazo (e-Portfolio)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --parchment:#f4e8d0;
      --parchment-shade:#e6d5b8;
      --parchment-dark:#d4c4a8;
      --ink:#2c1810;
      --ink-soft:#5d4037;
      --ink-faint:#8d6e63;
      --gold:#b8860b;
      --gold-light:#d4af37;
      --gold-pale:#e6c86e;
      --burgundy:#6a1b1b;
      --cover:#2c1810;
      --cover-light:#2e2723;
      --font-display:'Cinzel Decorative', serif;
      --font-title:'Cinzel', serif;
      --font-body:'Cormorant Garamond', serif;
      --font-script:'Tangerine', cursive;
      --page-w:clamp(320px, 42vw, 560px);
      --page-h:clamp(500px, 92vh, 820px);
    }
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    html{
      scroll-behavior:smooth;
    }
    html, body{
      width:100%;
      height:100%;
      background:#1a0f0a;
      font-family:var(--font-body);
      color:var(--ink);
    }
    body.no-scroll{
      overflow:hidden;
      height:100vh;
    }
    .site-nav{
      position:fixed;
      top:18px;
      left:18px;
      z-index:50;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      max-width:calc(100vw - 36px);
    }
    .site-nav a{
      font-family:var(--font-title);
      font-size:11px;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:#ffffff;
      background:#3e2418;
      border:1px solid rgba(212,175,55,0.3);
      padding:8px 16px;
      border-radius:20px;
      text-decoration:none;
      backdrop-filter:blur(6px);
      transition:all 0.25s ease;
      white-space:nowrap;
    }
    .site-nav a:hover{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .site-nav a.active{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .landing-section{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:sticky;
      top:0;
      padding:100px 24px 60px;
      overflow:hidden;
    }
    #home{
      z-index:1;
    }
    #about{
      z-index:2;
    }
    #contents{
      z-index:3;
    }
    #image{
      z-index:4;
    }
    .parallax-layer{
      position:absolute;
      top:-20%;
      left:0;
      right:0;
      bottom:-20%;
      z-index:0;
      pointer-events:none;
      will-change:transform;
    }
    .landing-section > *:not(.parallax-layer){
      position:relative;
      z-index:1;
    }
    .landing-section .reveal-item{
      opacity:0;
      transform:translateY(34px);
      transition:opacity 0.3s ease, transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .landing-section .reveal-item.reveal-slow{
      transform:translateY(48px) scale(0.96);
      transition:opacity 0.9s ease, transform 0.9s cubic-bezier(0.22,1,0.36,1);
    }
    .landing-section .reveal-item.reveal-fast{
      transform:translateY(18px);
      transition:opacity 0.22s ease, transform 0.22s ease;
    }
    .landing-section.in-view .reveal-item{
      opacity:1;
      transform:translateY(0) scale(1);
    }
    .landing-section .reveal-item:nth-child(1){
      transition-delay:0.03s;
    }
    .landing-section .reveal-item:nth-child(2){
      transition-delay:0.1s;
    }
    .landing-section .reveal-item:nth-child(3){
      transition-delay:0.17s;
    }
    .landing-section .reveal-item:nth-child(4){
      transition-delay:0.24s;
    }
    .landing-section .reveal-item:nth-child(5){
      transition-delay:0.31s;
    }
    .split-text .letter{
      display:inline-block;
      opacity:0;
      transform:translateY(var(--ty, 26px)) rotate(var(--rot, 10deg)) scale(0.6);
      transition:opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .split-text.text-short .letter{
      transition:opacity 0.45s ease, transform 0.99s cubic-bezier(0.34,1.56,0.64,1);
    }
    .split-text.text-long .letter{
      transition:opacity 0.16s ease, transform 0.50s ease;
    }
    .landing-section.in-view .split-text .letter{
      opacity:1;
      transform:translateY(0) rotate(0deg) scale(1);
    }
    #home{
      text-align:center;
    }
    #home{
      background:
        radial-gradient(ellipse at 30% 20%, rgba(120,90,70,0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(90,65,50,0.6) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    .home-header{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:36px;
      flex-wrap:wrap;
    }
    .home-photo{
      width:clamp(180px, 20vw, 260px);
      height:clamp(180px, 20vw, 260px);
      border-radius:50%;
      object-fit:cover;
      border:4px solid var(--gold);
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      flex-shrink:0;
    }
    .home-text{
      text-align:left;
    }
    #home h1{
      font-family:var(--font-display);
      font-size:clamp(32px, 6vw, 58px);
      color:var(--gold-pale);
      letter-spacing:0.08em;
      text-shadow:0 2px 12px rgba(0,0,0,0.6);
      margin-bottom:14px;
    }
    #home p{
      font-family:var(--font-script);
      font-size:clamp(22px, 3vw, 34px);
      color:var(--gold-light);
      max-width:600px;
    }
    @media (max-width:640px){
      .home-header{
        flex-direction:column;
        text-align:center;
      }
      .home-text{
        text-align:center;
      }
    }
    #about{
      text-align:center;
    }
    #about .parallax-layer{
      background:
        radial-gradient(ellipse at 70% 20%, rgba(120,90,70,0.5) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    #about h2, #image h2{
      font-family:var(--font-display);
      font-size:clamp(26px, 4.5vw, 42px);
      color:var(--gold-pale);
      letter-spacing:0.06em;
      margin-bottom:18px;
    }
    #about p{
      font-family:var(--font-body);
      font-size:clamp(16px, 2vw, 20px);
      color:var(--parchment-dark, #ddd);
      max-width:640px;
      line-height:1.7;
    }
    #contents{
      padding:0;
      min-height:100vh;
      overflow:visible;
    }
    #contents .bookshelf-scene{
      min-height:100vh;
    }
    #image{
      text-align:center;
    }
    #image .parallax-layer{
      background:
        radial-gradient(ellipse at 30% 80%, rgba(120,90,70,0.5) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    #image img{
      max-width:min(90vw, 560px);
      width:100%;
      border-radius:6px;
      border:2px solid var(--gold);
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
    }  
    .bookshelf-scene{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(62,39,35,0.5) 0% transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(44,24,16,0.6) 0% transparent 50%),
        linear-gradient(180deg, #1a0f0a 0%, #2c1810 40%, #1a0f0a 100%);
      position:relative;
      transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
    }
    .bookshelf-scene.hidden{
      opacity:0;
      pointer-events:none;
      transform:scale(0.92);
      filter:blur(8px);
    }
    .bookshelf-scene::before{
      content:'';
      position:absolute;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity:0.4;
      pointer-events:none;
    }
    .shelf-header{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-header h1{
      font-family:var(--font-display);
      font-size:clamp(28px, 5vw, 48px);
      color:var(--gold-pale);
      letter-spacing:0.1em; 
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      text-align:center;
    }
    .shelf-header p{
      font-family:var(--font-script);
      font-size:clamp(22px, 2.5vw, 34px);
      color:var(--gold-light);
      margin-top:4px;
    }
    .shelf-container{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-row{
      position:relative;
      width:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:clamp(8px, 2vw, 24px);
      padding:20px 30px 14px;
      background:
        linear-gradient(180deg, rgba(62,39,35,0) 0%, rgba(62,39,35,0.4) 100%),
        linear-gradient(90deg, #3e2723 0%, #5d4037 20%, #4e342e 50%, #5d4037 80%, #3e2723 100%);
      border-radius:4px;
      box-shadow:inset 0 4px 8px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.5);
    }
    .shelf-row::after{
      content:'';
      position:absolute;
      bottom:-10px;
      left:0;
      right:0;
      height:10px;
      background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
      border-radius:0 0 4px 4px;
    }
    .book-spine{
      position:relative;
      width:clamp(44px, 8vw, 72px);
      height:clamp(160px, 28vh, 260px);
      border-radius:3px 3px 0 0;
      cursor:pointer;
      transform-origin:bottom center;
      transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 6px 10px;
      text-align:center;
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.1), inset -2px 0 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.3);
      overflow:hidden;
    }
    .book-spine::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine::after{
      content:'';
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:2px;
      height:100%;
      background:linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine:hover{
      transform:translateY(-18px) scale(1.05);
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.12), inset -2px 0 4px rgba(0,0,0,0.15), 0 18px 40px rgba(0,0,0,0.5);
      filter:brightness(1.15);
      z-index:10;
    }
    .book-spine:active{
      transform:translateY(-10px) scale(1.02);
    }
    .spine-episode{
      font-family:var(--font-title);
      font-size:clamp(8px, 1.2vw, 11px);
      letter-spacing:0.15em;
      text-transform:uppercase;
      opacity:0.85;
      margin-bottom:8px;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex-shrink:0;
    }
    .spine-title{
      font-family:var(--font-display);
      font-size:clamp(11px, 1.8vw, 16px);
      font-weight:700;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex:1;
      display:flex;
      align-items:center;
      line-height:1.3;
      text-shadow:0 1px 3px rgba(0,0,0,0.4);
    }
    .spine-ornament{
      font-size:14px;
      margin-top:auto;
      opacity:0.7;
    }
    .spine-band{
      position:absolute;
      left:0;
      right:0;
      height:3px;
      background:rgba(255,255,255,0.15);
    }
    .spine-band.top{
      top:28px;
    }
    .spine-band.bottom{
      bottom:28px;
    }
    .palette-classic{
      background:linear-gradient(90deg, #3e2723, #5d4037, #3e2723);
      color:#e6c86e;
      border:1px solid #5d4037;
    }
    .palette-ocean{
      background:linear-gradient(90deg, #0a2540, #154360, #0a2540);
      color:#7fdbda;
      border:1px solid #1a5276;
    }
    .palette-forest{
      background:linear-gradient(90deg, #1b4332, #2d6a4f, #1b4332);
      color:#d8f3dc;
      border:1px solid #40916c;
    }
    @keyframes fadeInDown{
      from{ opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);}
    }
    @keyframes fadeInUp{
      from{ opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);}
    }
    .book-spine{
      animation:fadeInUp 0.7s ease backwards;
    }
    .reader-scene{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(62,39,35,0.6) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 30%, rgba(93,64,55,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(44,24,16,0.8) 0%, transparent 50%),
        linear-gradient(135deg, #2c1810 0%, #1a0f0a 50%, #2c1810 100%);
      opacity:0;
      pointer-events:none;
      transform:scale(1.08);
      transition:opacity 0.6s ease, transform 0.6s cubic-bezier(0.25,1,0.5,1);
      z-index:100;
    }
    .reader-scene.active{
      opacity:1;
      pointer-events:auto;
      transform:scale(1);
    }
    .reader-scene::before{
      content:'';
      position:absolute;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity:0.5;
      pointer-events:none;
    }
    .close-shelf-btn{
      position:fixed;
      top:18px;
      left:18px;
      z-index:3000;
      font-family:var(--font-title);
      font-size:12px;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:var(--gold-pale);
      background:rgba(26,15,10,0.7);
      border:1px solid rgba(212,175,55,0.3);
      padding:8px 16px;
      border-radius:20px;
      cursor:pointer;
      backdrop-filter:blur(6px);
      transition:all 0.25s ease; 
      opacity:0;
      pointer-events:none;
    }
    .close-shelf-btn.visible{
      opacity:1;
      pointer-events:auto;
    }
    .close-shelf-btn:hover{
      background:rgba(212,175,55,0.15);
      border-color:var(--gold);
      color:var(--gold-light);
    }
    .book-wrap{
      position:relative;
      perspective:2200px;
      width:calc(var(--page-w) * 2);
      height:var(--page-h);
    }
    .book{
      position:relative;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      filter:drop-shadow(0 20px 40px rgba(0,0,0,0.6));
    }
    .base-left{
      position:absolute;
      top:0;
      left:0;
      width:50%;
      height:100%;
      background:var(--parchment-shade);
      border-radius:6px 0 0 6px;
      box-shadow:inset -3px 0 6px rgba(0,0,0,0.15);
    }
    .spine-shadow{
      position:absolute;
      top:0;
      left:50%;
      width:40px;
      height:100%;
      margin-left:-20px;
      background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0) 100%);
      pointer-events:none;
      z-index:15;
    }
    .sheet{
      position:absolute;
      top:0;
      right:0;
      width:50%;
      height:100%;
      transform-origin:left center;
      transform-style:preserve-3d;
      transition:transform 0.9s cubic-bezier(0.25,1,0.5,1);
    }
    .sheet-flipped{
      transform:rotateY(-180deg);
    }
    .face{
      position:absolute;
      inset:0;
      backface-visibility:hidden;
      overflow:hidden;
      border-radius:2px 6px 6px 2px;
      box-shadow:inset 4px 0 8px rgba(0,0,0,0.1), inset -1px 0 2px rgba(255,255,255,0.3), 2px 0 6px rgba(0,0,0,0.15);
    }
    .face-front{
      background:var(--parchment);
    }
    .face-back{
      background:var(--parchment-shade);
      transform:rotateY(180deg);
      border-radius:6px 2px 2px 6px;
      box-shadow:inset -4px 0 8px rgba(0,0,0,0.1), inset 1px 0 2px rgba(255,255,255,0.3), -2px 0 6px rgba(0,0,0,0.15);
    }
    .face::before{
      content:'';
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at 30% 20%, rgba(212,196,168,0.3) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(230,213,184,0.3) 0%, transparent 50%);
      pointer-events:none;
      opacity:0.6;
    }
    .page-content{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      padding:clamp(20px,4.5vw,36px);
      display:flex;
      flex-direction:column;
      overflow-y:auto;
      scrollbar-width:thin;
      scrollbar-color:var(--gold-pale) transparent;
    }
    .page-content::-webkit-scrollbar{
      width:4px;
    }
    .page-content::-webkit-scrollbar-thumb{
      background:var(--gold-pale);
      border-radius:2px;
    }
    .corner{
      position:absolute;
      width:32px;
      height:32px;
      z-index:2;
      pointer-events:none;
      opacity:0.6;
    }
    .corner-tl{
      top:12px;
      left:12px;
      border-top:2px solid var(--gold);
      border-left:2px solid var(--gold);
    }
    .corner-tr{
      top:12px;
      right:12px;
      border-top:2px solid var(--gold);
      border-right:2px solid var(--gold);
    }
    .corner-bl{
      bottom:12px;
      left:12px;
      border-bottom:2px solid var(--gold);
      border-left:2px solid var(--gold);
    }
    .corner-br{
      bottom:12px;
      right:12px;
      border-bottom:2px solid var(--gold);
      border-right:2px solid var(--gold);
    }
    .ornament{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin:14px 0;
      color:var(--gold);
      font-size:13px;
    }
    .ornament::before, .ornament::after{
      content:'';
      flex:1;
      height:1px;
      background:linear-gradient(90deg, transparent, var(--gold), transparent);
      max-width:80px;
    }
    .cover-content{
      background:linear-gradient(135deg, var(--cover) 0%, var(--cover-light) 50%, var(--cover) 100%);
      color:var(--gold-pale);
      text-align:center;
      justify-content:center;
      align-items:center;
      border:2px solid var(--gold);
      outline:1px solid var(--gold);

      function paginateContent(chunks){
        const measure = document.getElementById('measure-container');
        const isMobile = window.innerWidth <= 720;
        const paddingH = isMobile ? 36 : 72;
        const paddingV = isMobile ? 104 : 72;
        const pageW = (document.querySelector('.book-wrap')?.offsetWidth || 680) / 2 - paddingH;
        const pageH = (document.querySelector('.book-wrap')?.offsetHeight || 530) - paddingV;
        measure.style.cssText = `position:fixed; left:-9999px; width:${pageW}px; height:${pageH}px; overflow:hidden; visibility:hidden; pointer-events:none; display:flex; flex-direction:column;`;

        const pages = [];
        let current = '';
        for (let i = 0; i < chunks.length; i++){
          const test = current + chunks[i];
          measure.innerHTML = test;
          if (measure.scrollHeight > pageH && current !== ''){
            pages.push(current);
            current = chunks[i];
          } else {
            current = test;
          }
        }
        if (current) pages.push(current);
        if (!pages.length) pages.push('');
        measure.innerHTML = '';
        return pages;
      }

      function buildBookHTML(book){
        const sheets = [];
        let idx = 0, pg = 1;
        const mk = (f, b, fc, bc) => {
          const i = idx++;
          const fC = fc ? 'cover-content' : '';
          const bC = bc ? 'back-cover' : '';
          const fN = fc ? '' : `<span class="page-num">${pg++}</span>`;
          const bN = bc ? '' : `<span class="page-num">${pg++}</span>`;
          return `<div class="sheet" data-index="${i}"><div class="face face-front ${fC}"><div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div><div class="page-content ${fC}">${f}</div>${fN}</div><div class="face face-back ${bC}"><div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div><div class="page-content ${bC}">${b}</div>${bN}</div></div>`;
        };

        sheets.push(mk(
          `<p class="cover-kicker">A portfolio</p><div class="cover-line"></div><h1 class="cover-title">John Renz I. Vertudazo</h1><p class="cover-sub">${book.title}</p><div class="cover-line"></div><p class="cover-kicker" style="margin-top:24px; font-size:10px;">${book.episode}</p>`,
          `<div class="ornament">෴</div><p style="text-align:center; font-style:italic; color:var(--ink-faint); font-size:14px;">"Every story begins with a single line of code."</p><div class="ornament">෴</div>`,
          true, false
        ));
        
        const tocItems = book.chapters.map((c, i) =>
          `<button type="button" class="toc-item" data-goto="${i+2}"><span class="toc-num">${['I', 'II', 'III', 'IV'][i]}.</span><span class="toc-name">${c.name}</span><span class="toc-leader"></span><span class="toc-page">${3 + i*2}</span></button>`).join('');

        sheets.push(mk(
          `<p class="page-eyebrow">Enjoy reading the three activites</p><div class="ornament">෴</div><h1 class="page-title" style="font-size:clamp(22px, 3.6vw, 32px); margin-bottom:10px;">John Renz I. Vertudazo</h1><p style="font-family:var(--font-script); font-size:clamp(20px, 3.6vw, 28px); color:var(--burgundy); margin-bottom:14px;">${book.title}</p><p style="font-size:13px; color:var(--ink-faint); max-width:280px; margin:0 auto 18px;">Building software that can be used in real life. </p><div class="stamp"><span>Est.<br>${book.year}</span></div>`,
          `<p class="page-eyebrow">Contents</p><h2 class="page-title">Table of Contents</h2><div class="ornament">෴</div>${tocItems}`,
          false, false
        ));

        const fwChunks = book.foreword.map(p => `<div class="ornament">෴</div>` + p);
        const fwPages = paginateContent(fwChunks);
        fwPages.forEach((content, i) => {
          const eyebrow = i === 0 ? `<p class="page-eyebrow">Foreword</p><h2 class="page-title">${book.chapters[0].name}</h2>` : `<p class="page-eyebrow">Foreword<span style="color:var(--ink-faint); font-size:10px;">(continued)</span></p><div class="ornament">෴</div>`;
          const nav = i === 0 ? `<div class="page-nav"><button type="button" class="back-btn" data-goto="2">&lsaquo; Contents</button></div>` : '';
          sheets.push(mk(eyebrow + content + nav, `<div class="ornament">෴</div><p style="text-align:center; font-style:italic; color:var(--ink-faint);">Turn the page to continue...</p>`, false, false));
        });

        const workChunks = book.activity_1.map(renderChunk);
        const workPages = paginateContent(workChunks);
        workPages.forEach((content, i) => {
          const eyebrow = i === 0 ? `<p class="page-eyebrow">Activity 1</p><h2 class="page-title">${book.chapters[1].name}</h2><div class="ornament">෴</div>` : `<p class="page-eyebrow">Activity 1<span style="color:var(--ink-faint); font-size:10px;">(continued)</span></p><div class="ornament">෴</div>`;
          const nav = i === 0 ? `<div class="page-nav"><button type="button" class="back-btn" data-goto="2">&lsaquo; Contents</button></div>` : '';
          sheets.push(mk(eyebrow + content + nav, `<div class="ornament">෴</div><p style="text-align:center; font-style:italic; color:var(--ink-faint);">More works ahead...</p>`, false, false));
        });

        const  skillGroups = Object.entries(book.skills).map(([label, items]) => 
          `<div class="margin-group"><span class="margin-label">${label.charAt(0).toUpperCase()+label.slice(1)}</span><div class="margin-items">${items.map(it => `<span class="margin-item">${it}</span>`).join('')}</div></div>`
          ).join('');
        const activity2Chunks = book.activity_2.map(renderChunk);
        const activity2Pages = paginateContent(activity2Chunks);
        activity2Pages.forEach((content, i) => {
          const eyebrow = i === 0 ? `<p class="page-eyebrow">Activity 2</p><h2 class="page-title">${book.chapters[2].name}</h2>` : `<p class="page-eyebrow">Activity 2<span style="color:var(--ink-faint); font-size:10px;">(continued)</span></p><div class="ornament">෴</div>`;
          const nav = i === 0 ? `<div class="page-nav"><button type="button" class="back-btn" data-goto="2">&lsaquo; Contents</button></div>` : '';
          sheets.push(mk(eyebrow + content + nav, `<div class="ornament">෴</div><p style="text-align:center; font-style:italic; color:var(--ink-faint);">Turn the page to continue...</p>`, false, false));
        });

        const activity3Chunks = book.activity_3.map(renderChunk);
        const activity3Pages = paginateContent(activity3Chunks);
        activity3Pages.forEach((content, i) => {
          const eyebrow = i === 0 ? `<p class="page-eyebrow">Activity 3</p><h2 class="page-title">${book.chapters[3].name}</h2>` : `<p class="page-eyebrow">Activity 3<span style="color:var(--ink-faint); font-size:10px;">(continued)</span></p><div class="ornament">෴</div>`;
          const nav = i === 0 ? `<div class="page-nav"><button type="button" class="back-btn" data-goto="2">&lsaquo; Contents</button></div>` : '';
          sheets.push(mk(eyebrow + content + nav, `<div class="ornament">෴</div><p style="text-align:center; font-style:italic; color:var(--ink-faint);">Turn the page to continue...</p>`, false, false));
        });  

        sheets.push(mk(
          `<div class="ornament">෴</div><p style="font-family:var(--font-script); font-size:24px; color:var(--gold); text-align:center;">Thank you for reading...</p><div class="ornament">෴</div>`,
          `<p class="the-end">The End</p><div class="cover-line" style="background:var(--gold-light); margin:14px auto;"></div><p class="back-script">John Renz I. Vertudazo</p><p class="cover-kicker" style="margin-top:26px; font-size:10px; opacity:0.6;">&copy; MMXXVI</p>`,
          false, true
        ));

        return sheets.join('');
      }

      let currentBook = null; 
      let sheets = [];
      let current = 0;
      let total = 0;
      let animating = false;

      function openBook(book){
        currentBook = book;
        applyPalette(book.palette);
        document.getElementById('book').innerHTML = buildBookHTML(book);
        sheets = Array.from(document.querySelectorAll('.sheet'));
        total = sheets.length;
        current = 0;
        animating = false;

        document.getElementById('bookshelfScene').classList.add('hidden');
        document.getElementById('readerScene').classList.add('active');
        document.getElementById('closeShelfBtn').classList.add('visible');
        document.body.classList.add('no-scroll');

        render();
      }

      function closeBook(){
        document.getElementById('bookshelfScene').classList.remove('hidden');
        document.getElementById('readerScene').classList.remove('active');
        document.getElementById('closeShelfBtn').classList.remove('visible');
        document.body.classList.remove('no-scroll');
        document.getElementById('book').innerHTML = '';
        currentBook = null;
      }

      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      const indicator = document.getElementById('pageIndicator');
      const hint = document.getElementById('hint');
      const bookWrap = document.querySelector('.book-wrap');

      function render(){
        sheets.forEach((sheet, i) => {
          const front = sheet.querySelector('.face-front');
          const back = sheet.querySelector('.face-back');
          if (i < current){
            sheet.classList.add('sheet-flipped');
            sheet.style.zIndex = total + i;
            if (front) front.style.pointerEvents = 'none';
            if (back) back.style.pointerEvents = 'auto';
          } else { 
            sheet.classList.remove('sheet-flipped');
            sheet.style.zIndex = total - i;
            if (front) front.style.pointerEvents = 'auto';
            if (back) back.style.pointerEvents = 'none';
          }
        });
        btnPrev.disabled = current === 0;
        btnNext.disabled = current === total;
        const labels = ["Cover", "Title", "Contents"].concat(
          currentBook ? currentBook.chapters.map(c => c.name) : []
          ).concat(["End"]);
        indicator.textContent = labels[current] || (current >= total ? 'End' : current + 1);
        if (current > 0) hint.style.opacity = '0';
      }

      function turnTo(target){
        if (animating || target === current || target < 0 || target > total) return;
        animating = true;
        current = target;
        render();
        window.setTimeout(() => {animating = false;}, 950);
      }

      function renderChunk(item){
        if (typeof item === 'string') return item;
        let html = `<article class="plate">`;
        if (item.fig) html += `<span class="plate-fig">${item.fig}</span>`;
        if (item.title) html += `<h3 class="plate-title">${item.title}</h3>`;
        if (item.image) html += `<figure class="plate-figure"><img class="plate-img" src="${item.image}" alt="${item.title || ''} screenshot" loading="lazy"><figcaption>${item.imageCaption || ''}</figcaption></figure>`;
        if (item.desc) html += `<p class="plate-desc">${item.desc}</p>`;
        if (item.stack) html += `<p class="plate-stack">${item.stack}</p>`;
        if (item.link) html += `<a class="plate-link" href="${item.link}">View the work &arr</a>`;
        html += `</article>`;
        return html;
      }

      function next(){
        turnTo(current + 1);
      }
      function prev(){
        turnTo(current - 1);
      }

      btnNext.addEventListener('click', (e) => {e.stopPropagation(); next(); });
      btnPrev.addEventListener('click', (e) => {e.stopPropagation(); prev(); });

      document.addEventListener('click', (e) => {
        const navBtn = e.target.closest('.toc-item, .back-btn');
        if (navBtn) {
          e.stopPropagation();
          e.preventDefault();
          const target = parseInt(navBtn.dataset.goto, 10);
          if (!isNaN(target)) turnTo(target);
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') next();
        if (e.key === 'ArrowLeft') prev();
      });

      let touchStartX = 0, touchStartY = 0;
      bookWrap.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, {passive:true});

      bookWrap.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
          if (dx < 0) next(); else prev();
        }
      }, {passive:true});

      document.getElementById('closeShelfBtn').addEventListener('click', closeBook);

      renderBookshelf();

      const SHORT_TEXT_MAX = 30;

      function splitIntoLetters(el){
        const text = el.textContent;
        const isShort = text.trim().length <= SHORT_TEXT_MAX;
        el.textContent = '';
        el.classList.add('split-text', isShort ? 'text-short' : 'text-long');
        el.classList.remove('reveal-item');
        const perLetterDelay = isShort ? 0.05 : 0.008;
        [...text].forEach((ch, i) => {
          const span = document.createElement('span');
          span.className = 'letter';
          span.textContent = ch === ' ' ? '\u00A0' : ch;
          const ty = (Math.random() * 30 + 15).toFixed(0);
          const rot = (Math.random() * 34 - 17).toFixed(0);
          span.style.setProperty('--ty', ty + 'px');
          span.style.setProperty('--rot', rot + 'deg');
          span.style.transitionDelay = (i * perLetterDelay) + 's';
          el.appendChild(span);
        });
      }
      document.querySelectorAll('#home h1, #home p, #about h2, #image h2').forEach(splitIntoLetters);

      document.querySelectorAll('.reveal-item').forEach(el => {
        if (el.classList.contains('split-text')) return;
        const len = el.textContent.trim().length;
        if (len > 0 && len <= SHORT_TEXT_MAX){
          el.classList.add('reveal-slow');
        } else if (len > SHORT_TEXT_MAX){
          el.classList.add('reveal-fast');
        }
      });

      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          entry.target.classList.toggle('in-view', entry.isIntersecting);
        });
      }, {threshold: 0.2});
      document.querySelectorAll('.landing-section').forEach(sec => revealObserver.observe(sec));

      const parallaxLayers = document.querySelectorAll('.parallax-layer');
      function updateParallax(){
        parallaxLayers.forEach(layer => {
          const rect = layer.parentElement.getBoundingClientRect();
          layer.style.transform = `translateY(${rect.top * 0.25}px)`;
        });
      }
      window.addEventListener('scroll', () => requestAnimationFrame(updateParallax), {passive:true});
      updateParallax();

      const navLinks = document.querySelectorAll('.site-nav a');
      const navObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting){
            navLinks.forEach(link => {
              link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
            });
          }
        });
      }, {threshold: 0.5});
      document.querySelectorAll('.landing-section').forEach(sec => navObserver.observe(sec));
      
    </script>
  </body>
</html>
