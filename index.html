<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Renz I. Vertudazo (e-Portfolio)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --parchment:#f4e8d0;
      --parchment-shade:#e6d5b8;
      --parchment-dark:#d4c4a8;
      --ink:#2c1810;
      --ink-soft:#5d4037;
      --ink-faint:#8d6e63;
      --gold:#b8860b;
      --gold-light:#d4af37;
      --gold-pale:#e6c86e;
      --burgundy:#6a1b1b;
      --cover:#2c1810;
      --cover-light:#2e2723;
      --font-display:'Cinzel Decorative', serif;
      --font-title:'Cinzel', serif;
      --font-body:'Cormorant Garamond', serif;
      --font-script:'Tangerine', cursive;
      --page-w:clamp(500px, 100vw, 720px);
      --page-h:clamp(600px, 100vh, 830px);
    }
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    html{
      scroll-behavior:smooth;
    }
    html, body{
      width:100%;
      height:100%;
      background:#1a0f0a;
      font-family:var(--font-body);
      color:var(--ink);
    }
    body.no-scroll{
      overflow:hidden;
      height:100vh;
    }
    .site-nav{
      position:fixed;
      top:18px;
      left:18px;
      right:18px;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:nowrap;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .site-nav a{
      font-family:var(--font-title);
      font-size:11px;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:#ffffff;
      background:#3e2418;
      border:1px solid rgba(212,175,55,0.3);
      padding:8px 16px;
      border-radius:20px;
      text-decoration:none;
      backdrop-filter:blur(6px);
      transition:all 0.25s ease;
      white-space:nowrap;
    }
    .site-nav a:hover{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .site-nav a.active{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .nav-logo{
      display:flex;
      align-items:center;
      flex-shrink:0;
    }
    .logo-text{
      font-family:var(--font-display);
      font-size:18px;
      letter-spacing:0.12em;
      color:var(--gold-pale);
      text-shadow:0 2px 8px rgba(0,0,0,0.5);
      border:1px solid rgba(212,175,55,0.4);
      padding:6px 14px;
      border-radius:20px;
      background:rgba(26,15,10,0.6);
      backdrop-filter:blur(6px);
      transition:all 0.25s ease;
    }
    .nav-logo:hover .logo-text{
      background:rgba(212,175,55,0.15);
      border-color:var(--gold);
      color:var(--gold-light);
    }
    .logo-img{
      object-fit:cover;
      height:100px;
      width:100px;
      border-radius:6px;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
      background:white;
    }
    .nav-links{
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
      justify-content:flex-end;
    }
    .nav-links a{
      font-family:var(--font-title);
      font-size:15px;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:#ffffff;
      background:#3e2418;
      border:1px solid rgba(212,175,55,0.3);
      padding:8px 16px;
      border-radius:20px;
      text-decoration:none;
      backdrop-filter:blur(6px);
      transition:all 0.25s ease;
      white-space:wrap;
      font-weight:600;
    }
    .nav-links a:hover{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .nav-links a.active{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .landing-section{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:sticky;
      top:0;
      padding:100px 24px 60px;
      overflow:hidden;
    }
    #home{
      z-index:1;
    }
    #about{
      z-index:2;
    }
    #contents{
      z-index:3;
    }
    #image{
      z-index:4;
    }
    .parallax-layer{
      position:absolute;
      top:-20%;
      left:0;
      right:0;
      bottom:-20%;
      z-index:0;
      pointer-events:none;
      will-change:transform;
    }
    .landing-section > *:not(.parallax-layer){
      position:relative;
      z-index:1;
    }
    .landing-section .reveal-item{
      opacity:0;
      transform:translateY(34px);
      transition:opacity 0.3s ease, transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .landing-section .reveal-item.reveal-slow{
      transform:translateY(48px) scale(0.96);
      transition:opacity 0.9s ease, transform 0.9s cubic-bezier(0.22,1,0.36,1);
    }
    .landing-section .reveal-item.reveal-fast{
      transform:translateY(18px);
      transition:opacity 0.22s ease, transform 0.22s ease;
    }
    .landing-section.in-view .reveal-item{
      opacity:1;
      transform:translateY(0) scale(1);
    }
    .landing-section .reveal-item:nth-child(1){
      transition-delay:0.03s;
    }
    .landing-section .reveal-item:nth-child(2){
      transition-delay:0.1s;
    }
    .landing-section .reveal-item:nth-child(3){
      transition-delay:0.17s;
    }
    .landing-section .reveal-item:nth-child(4){
      transition-delay:0.24s;
    }
    .landing-section .reveal-item:nth-child(5){
      transition-delay:0.31s;
    }
    .landing-section.in-view .home-photo.reveal-item{
      transform:translateY(0) scale(1);
      opacity:1;
    }
    .split-text .letter{
      display:inline-block;
      opacity:0;
      transform:translateY(var(--ty, 26px)) rotate(var(--rot, 10deg)) scale(0.6);
      transition:opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .split-text.text-short .letter{
      transition:opacity 0.45s ease, transform 0.99s cubic-bezier(0.34,1.56,0.64,1);
    }
    .split-text.text-long .letter{
      transition:opacity 0.16s ease, transform 0.50s ease;
    }
    .landing-section.in-view .split-text .letter{
      opacity:1;
      transform:translateY(0) rotate(0deg) scale(1);
    }
    #home{
      text-align:center;
    }
    #home{
      background:
        radial-gradient(ellipse at 30% 20%, rgba(120,90,70,0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(90,65,50,0.6) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    .home-header{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:36px;
      flex-wrap:wrap;
    }
    .home-photo{
      width:clamp(250px, 20vw, 340px);
      height:clamp(860px, 100vw, 820px);
      border-radius:10px;
      object-fit:cover;
      object-position:cover-top;
      border:none;
      flex-shrink:0;
      transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), filter 0.35s ease;
      filter:
        drop-shadow(0 10px 20px rgba(255,90,56,0.9)),
        drop-shadow(0 4px 8px rgba(255,90,56,0.9));   
    }
    .home-photo:hover{
      transform:scale(1.05);
      filter:
        drop-shadow(0 14px 28px rgba(255,90,56,0.95))
        drop-shadow(0 6px 12px rgba(255,90,56,0.9));
    }
    .home-photo.reveal-item{
      transform:translateY(40px) scale(0.88);
      opacity:0;
      transition:opacity 0.7s ease, transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
      transition-delay:3.99s;
    }
    .home-text{
      text-align:left;
      min-width:0;
      flex:1 1 auto
    }
    #home h1, #home p{
      overflow-wrap:break-word;
      word-break:break-word;
    }
    #home h1{
      font-family:var(--font-display);
      font-size:clamp(28px, 3vw, 50px);
      color:var(--gold-pale);
      letter-spacing:0.04em;
      text-shadow:0 2px 12px rgba(0,0,0,0.6);
      margin-bottom:14px;
    }
    #home p{
      font-family:var(--font-script);
      font-size:clamp(22px, 3vw, 34px);
      color:var(--gold-light);
      max-width:600px;
    }
    @media (max-width:480px){
      .home-header{
        gap:16px;
        align-items:flex-start;
      }
      .home-photo{
        width:clamp(110px, 34vw, 150px);
        height:clamp(180px, 58vw, 260px);
      }
      #home h1{
        font-size:clamp(16px, 2vw, 24px);
      }
      #home p{
        font-size:clamp(14px, 2vw, 20px);
      }
    }
    #about{
      text-align:center;
    }
    #about .parallax-layer{
      background:
        radial-gradient(ellipse at 70% 20%, rgba(120,90,70,0.5) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    #about h2{
      font-family:var(--font-display);
      font-size:clamp(26px, 4.5vw, 42px);
      color:var(--gold-pale);
      letter-spacing:0.06em;
      margin-bottom:18px;
    }
    #image h2{
      font-family:var(--font-display);
      font-size:clamp(26px, 4.5vw, 42px);
      color:var(--gold-pale);
      letter-spacing:0.06em;
      margin-bottom:50px;
    }
    #about p{
      font-family:var(--font-body);
      font-size:clamp(16px, 2vw, 20px);
      color:var(--parchment-dark, #ddd);
      max-width:640px;
      line-height:1.7;
    }
    #contents{
      padding:0;
      min-height:100vh;
      overflow:visible;
    }
    #contents .bookshelf-scene{
      min-height:100vh;
    }
    #image{
      text-align:center;
    }
    #image .parallax-layer{
      background:
        radial-gradient(ellipse at 30% 80%, rgba(120,90,70,0.5) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    .carousel-wrap{
      position:relative;
      width:100%;
      max-width:900px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(6px, 2vw, 16px);
    }
    .carousel-viewport{
      position:relative;
      width:min(70vw, 620px);
      height:clamp(240px, 40vw, 380px);
      perspective:1800px;
      overflow:visible;
    }
    .carousel-track{
      position:absolute;
      inset:0;
      transform-style:preserve-3d;
      transition:transform 0.7s cubic-bezier(0.25,1,0.5,1);
    }
    .carousel-item{
      position:absolute;
      top:0;
      left:50%;
      width:clamp(150px, 24vw, 260px);
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      cursor:pointer;
      transition:opacity 0.6s ease, filter 0.6s ease;
      backface-visibility:hidden;
    }
    .carousel-item img{
      width:100%;
      height:78%;
      object-fit:cover;
      border-radius:6px;
      border:2px solid var(--gold);
      box-shadow:0 16px 34px rgba(0,0,0,0.5);
      background:#2c1810;
    }
    .carousel-item .carousel-caption{
      margin-top:10px;
      font-family:var(--font-title);
      font-size:clamp(11px, 1.6vw, 14px);
      letter-spacing:0.04em;
      color:var(--gold-pale);
      text-align:center;
      text-shadow:0 2px 8px rgba(0,0,0,0.6);
    }
    .carousel-item:not(.is-active){
      opacity:0.4;
      filter:brightness(0.55) saturate(0.7);
    }
    .carousel-item.is-active{
      opacity:1;
      filter:none;
    }
    .carousel-item.is-active img{
      box-shadow:0 20px 46px rgba(0,0,0,0.65), 0 0 0 3px rgba(212,175,55,0.35);
    }
    .carousel-arrow{
      flex-shrink:0;
      width:44px;
      height:44px;
      border-radius:50%;
      border:1px solid rgba(212,175,55,0.4);
      background:rgba(26,15,10,0.6);
      color:var(--gold-pale);
      font-size:18px;
      line-height:1;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all 0.25s ease;
      backdrop-filter:blur(6px);
    }
    .carousel-arrow:hover{
      background:rgba(212,175,55,0.18); 
      border-color:var(--gold);
      color:var(--gold-light);
      transform:scale(1.08);
    }
    .carousel-dots{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:8px;
      margin-top:22px;
      position:relative;
      z-index:1;
    }
    .carousel-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:rgba(212,175,55,0.3);
      border:1px solid rgba(212,175,55,0.5);
      cursor:pointer;
      padding:0;
      transition:all 0.25s ease;
    }
    .carousel-dot.is-active{
      background:var(--gold);
      transform:scale(1.3);
    }
    @media (max-width:640px){
      .carousel-viewport{
        width:min(85vw, 420px);
        height:clamp(260px, 55vw, 360px);
      }
      .carousel-arrow{
        width:34px;
        height:34px;
        font-size:14px;
      }
      .carousel-item{
        width:min(65vw, 240px);
      }
      .carousel-wrap{
        gap:8px;
      }
    }   
    .bookshelf-scene{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(62,39,35,0.5) 0% transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(44,24,16,0.6) 0% transparent 50%),
        linear-gradient(180deg, #1a0f0a 0%, #2c1810 40%, #1a0f0a 100%);
      position:relative;
      transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
    }
    .bookshelf-scene.hidden{
      opacity:0;
      pointer-events:none;
      transform:scale(0.92);
      filter:blur(8px);
    }
    .bookshelf-scene::before{
      content:'';
      position:absolute;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity:0.4;
      pointer-events:none;
    }
    .shelf-header{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-header h1{
      font-family:var(--font-display);
      font-size:clamp(28px, 5vw, 48px);
      color:var(--gold-pale);
      letter-spacing:0.1em; 
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      text-align:center;
    }
    .shelf-header p{
      font-family:var(--font-script);
      font-size:clamp(22px, 2.5vw, 34px);
      color:var(--gold-light);
      margin-top:4px;
    }
    .shelf-container{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-row{
      position:relative;
      width:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:clamp(8px, 2vw, 24px);
      padding:20px 30px 14px;
      background:
        linear-gradient(180deg, rgba(62,39,35,0) 0%, rgba(62,39,35,0.4) 100%),
        linear-gradient(90deg, #3e2723 0%, #5d4037 20%, #4e342e 50%, #5d4037 80%, #3e2723 100%);
      border-radius:4px;
      box-shadow:inset 0 4px 8px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.5);
    }
    .shelf-row::after{
      content:'';
      position:absolute;
      bottom:-10px;
      left:0;
      right:0;
      height:10px;
      background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
      border-radius:0 0 4px 4px;
    }
    .book-spine{
      position:relative;
      width:clamp(44px, 8vw, 72px);
      height:clamp(160px, 28vh, 260px);
      border-radius:3px 3px 0 0;
      cursor:pointer;
      transform-origin:bottom center;
      transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 6px 10px;
      text-align:center;
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.1), inset -2px 0 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.3);
      overflow:hidden;
    }
    .book-spine::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine::after{
      content:'';
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:2px;
      height:100%;
      background:linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine:hover{
      transform:translateY(-18px) scale(1.05);
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.12), inset -2px 0 4px rgba(0,0,0,0.15), 0 18px 40px rgba(0,0,0,0.5);
      filter:brightness(1.15);
      z-index:10;
    }
    .book-spine:active{
      transform:translateY(-10px) scale(1.02);
    }
    .spine-episode{
      font-family:var(--font-title);
      font-size:clamp(8px, 1.2vw, 11px);
      letter-spacing:0.15em;
      text-transform:uppercase;
      opacity:0.85;
      margin-bottom:8px;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex-shrink:0;
    }
    .spine-title{
      font-family:var(--font-display);
      font-size:clamp(11px, 1.8vw, 16px);
      font-weight:700;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex:1;
      display:flex;
      align-items:center;
      line-height:1.3;
      text-shadow:0 1px 3px rgba(0,0,0,0.4);
    }
    .spine-ornament{
      font-size:14px;
      margin-top:auto;
      opacity:0.7;
    }
    .spine-band{
      position:absolute;
      left:0;
      right:0;
      height:3px;
      background:rgba(255,255,255,0.15);
    }
    .spine-band.top{
      top:28px;
    }
    .spine-band.bottom{
      bottom:28px;
    }
    .palette-classic{
      background:linear-gradient(90deg, #3e2723, #5d4037, #3e2723);
      color:#e6c86e;
      border:1px solid #5d4037;
    }
    .palette-ocean{
      background:linear-gradient(90deg, #0a2540, #154360, #0a2540);
      color:#7fdbda;
      border:1px solid #1a5276;
    }
    .palette-forest{
      background:linear-gradient(90deg, #1b4332, #2d6a4f, #1b4332);
      color:#d8f3dc;
      border:1px solid #40916c;
    }
    @keyframes fadeInDown{
      from{ opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);}
    }
    @keyframes fadeInUp{
      from{ opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);}
    }
    .book-spine{
      animation:fadeInUp 0.7s ease backwards;
    }
    .reader-scene{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:

            makeFSSectionHeader('TARGET YOUR LEARNING OUTCOME', '📄'),
            `<p>➢ At the end of this Episode, I must be able to determine the characteristics of a school environment that is safe, secure, and is supportive of learning (PPST 2.1.1).</p>`,
            makeFSSectionHeader('REVISIT THE LEARNING ESSENTIALS ', '👨‍🏫'),
            `<p>❶ A physical environment conducive for learning is one that has consistent practices that:</p>`,
            `<p style="text-indent:15px;">• keep the school safe, clean, orderly and free from distraction;</p>`,
            `<p style="text-indent:15px;">• maintain facilities that provide challenging activities; and </p>`,
            `<p style="text-indent:15px;">• address the physical social and psychological needs of the students.</p>`,
            `<p>❷ Display boards can be powerful in communicating information about the learning environment. They help in building and establishing the school culture. These voids become one way for everyone to learn about the visionmission, goals, and values that the school upholds.</p>`,
            `<p>❸ As a basic part of the school's visual environment, display boards have four general purposes:</p>`, 
            `<p style="text-indent:15px;">• <b>Decorative -</b> They offer visual stimulation and appeal to aesthetics. They set the social and psychological atmosphere of the school. </p>`, 
            `<p style="text-indent:15px;">• <b>Motivational -</b> They encourage students to perform better and have greater confidence. An example would be the display of students outputs that show that each output is recognized and valued. The bulletin boards help celebrate the learners growth and progress. </p>`, 
            `<p style="text-indent:15px;">• <b>Informational -</b> They are used as a strategy to readily disseminate information. </p>`,
            `<p style="text-indent:15px;">• <b>Instructional -</b> They move students to respond and participate through interactive displays. They get students to think about and communicate their learning.</p>`,
            `<p>❹ The set of criteria for evaluating bulletin board displays includes effective communication, attractiveness, balance, unity, interactivity, eligibility, correctness, and durability. </p>`,  
            ],

            makeFSSectionHeader('OBSERVE', '👀'),

            `<p>Read the following statements carefully. Then write your observation report on the space provided.</p>`,

                ['2. Describe the school campus. What colours do you see? What is the condition of the buildings?','The school campus composed of three educational levels (primary, secondary, and tertiary). Mostly, the color of buildings are white and maroon. Few of the buildings were old and abandoned and some were new and under construction.'],

            `<p>1) Look at the walls of the classroom. What are posted on the walls? What heroes, religious figures, lessons, visual aids announcements do you see posted?<p>`,
            `<p style="text-indent:15px;"><u>The materials posted on the walls are opening and closing prayers as well as, names of daily sweepers.</u></p>`,

            `<p style="text-indent:15px;"><u>The classroom has teachers desk at the back, two long tables, twenty-seven monoblock chairs, and five armchairs.</u></p>`,

            `<p>3) What learning materials or equipment are present?</p>`,

            `<br>`,
            `<p>4) Observe the students how many are occupying one room?</p>`,

            pageBreak(),
            `<p>5) Is the room well-lit and well ventilated?</p>`,
            `<p style="text-indent:15px;"><u>No, because the ceiling is painted mostly in black with Christmas balls. Its theme solar system is appropriate to science subject, yet it reduces the light reduces the light needed by the students because some of them are wearing eyeglasses.</u></p>`,
            `<p style="text-indent:15px;"><u>The space is too crowded because the bookshelf on the left side, then another table at the back contains a large box, and a teachers desk that has also stocks of books. There is not enough space if they have an interactive activity.</u></p>`,
            `<p style="text-indent:15px;"><u>It is also not well-ventilated because the door and windows are always closed.</u></p>`,

            `<br>`,

            `<p>Is the classroom of Grade 10 – Masayahin conducive to learning? No, because the seat arrangement of the students is not flexible to other indoor activities of the class. There is no copy of the National Anthem at the upper left-hand corner and on the other side, also no framed copy of the Pledge of Allegiance to the Philippine Flag. Profile of Students is missing. Proper ventilation and lighting are not prioritized. The classroom shared desk and layout do not have enough space to do group work in spacious areas. The</p>`,

            `<p>bulletin board contains information about climate change, yet the other bulletin board on the left side has no information therefore, it can be used for displaying the works of the learners. There are still things within the classroom that need improvement, but since teachers are already overloaded with duties, these tasks can be done gradually, one by one or little by little with the help of the students. The classroom needs improvement so that students can breathe and move around comfortably during activities. As Susan Brooks said, “It is the learning environment that determines a student's success and motivation.”</p>`,

            makeFSSectionHeader('REFLECT', '💭'),
            `<p>1) Would you like to teach in the school environment you just observe? Why? Why not?</p>`,
            `<p style="text-indent:15px;"><u>Of course, it as an opportunity to teach in the school environment I just observe. After all, who knows? Maybe those cheerful Grade 10 students are waiting for me to be part of their high school journey, even if their classroom isn't exactly the best. As Clint Eastwood said, “Sometimes if you want to see change for the better, you have to take things into your own hands.”</u></p>`,
            `<br>`,
            `<p>2) What kind of school campus is conducive to learning?</p>`,
            `<p style="text-indent:15px;"><u>A school campus conducive to learning should promote emotional well-being and social development, ensuring that students wear smiles and show excitement before and after school. As Karl Urban said, “Nothing beats a great smile.”</u></p>`,
            `<br>`,
            `<p>3) What kind of classroom is conducive to learning?</p>`,

      function paginateContent(chunks){
        const measure = document.getElementById('measure-container');
        const isMobile = window.innerWidth <= 720;
        const paddingH = isMobile ? 36 : 72;
        const paddingV = isMobile ? 104 : 72;
        const pageW = (document.querySelector('.book-wrap')?.offsetWidth || 680) / 2 - paddingH;
        const headerReserve = 80;
        const navReserve = 48;
        const pageH = (document.querySelector('.book-wrap')?.offsetHeight || 530) - paddingV - headerReserve - navReserve;
        measure.style.cssText = `position:fixed; left:-9999px; width:${pageW}px; height:${pageH}px; overflow:hidden; visibility:hidden; pointer-events:none; display:flex; flex-direction:column;`;

        const pages = [];
        let current = '';
        for (let i = 0; i < chunks.length; i++){
          const chunk = chunks[i];
          if (chunk === '<!--PAGEBREAK-->'){
            if (current !== ''){
              pages.push(current);
              current = '';
            }
            continue;
          }
          const test = current + chunks[i];
          measure.innerHTML = test;
          if (measure.scrollHeight > pageH && current !== ''){
            pages.push(current);
            current = chunks[i];
          } else {
            current = test;
          }
        }
        if (current) pages.push(current);
        if (!pages.length) pages.push('');
        measure.innerHTML = '';
        return pages;
      }

      function buildBookHTML(book){

        let idx = 0, pg = 1;

          if (!list || !list.length) return '';
          const q = list[quoteIdx % list.length];
          quoteIdx++;
          return q;
        }
        const mk = (f, b, fc, bc) => {
          const i = idx++;
          const fC = fc ? 'cover-content' : '';
          const bC = bc ? 'back-cover' : '';
          const fN = fc ? '' : `<span class="page-num">${pg++}</span>`;
          const bN = bc ? '' : `<span class="page-num">${pg++}</span>`;
          return `<div class="sheet" data-index="${i}"><div class="face face-front ${fC}"><div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div><div class="page-content ${fC}">${f}</div>${fN}</div><div class="face face-back ${bC}"><div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div><div class="page-content ${bC}">${b}</div>${bN}</div></div>`;
        };

        sheets.push(mk(
          `<h1 class="cover-title" style="color:var(--gold);">${book.fstitle}</h1>`,
          `<div style="display:flex; flex:1; flex-direction:column; align-items:center; text-align:center; justify-content:center;"><div class="ornament">෴</div><p style="font-style:italic; color:var(--ink-faint); font-size:20px; font-weight:500;">"${book.quotes.cover}"</p><div class="ornament">෴</div></div>`,
          true, false
        ));

        const chapterPagesList = book.chapters.map(chapter => {
          const items = book[chapter.type];
          if (!Array.isArray(items) || !items.length) return [];
          return paginateContent(items.map(renderChunk));
        });
        const chapterPageCounts = chapterPagesList.map(pages => pages.length);
        

        let nextStart = 4;
        const chapterRanges = chapterPageCounts.map(count => {
          const start = nextStart;
          const end = start + (count * 2) -  1;
          nextStart = end + 1;
          return {start, end};
        });
        const formatRange = ({start, end}) => start === end ? `${start}` : `${start}\u2013${end}`;

        let nextSheetIndex = 2;
        const chapterSheetStarts = chapterPageCounts.map(count => {
          const s = nextSheetIndex;
          nextSheetIndex += count;
          return s;
        });

        const romanNumerals = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
        
        const tocItems = book.chapters.map((c, i) =>
          `<button type="button" class="toc-item" data-goto="${chapterSheetStarts[i]}"><span class="toc-num">${romanNumerals[i] || (i + 1)}.</span><span class="toc-name">${c.name}</span><span class="toc-leader"></span><span class="toc-page">${formatRange(chapterRanges[i])}</span></button>`).join('');

        sheets.push(mk(
          `<div class="page-eyebrow">${book.titlePageEyebrow}</div><div class="ornament">෴</div><div style=" text-align:center; justify-content:center; align-items:center; display:flex; flex:1; flex-direction:column;"><h1 class="page-title" style="font-size:clamp(22px, 3.6vw, 32px); margin-bottom:50px;">${book.titleEpisode}</h1><div class="stamp"><span>Est.<br>${book.year}</span></div></div>`,
          `<h2 class="page-title">Table of Contents</h2><div class="ornament">෴</div>${tocItems}`,
          false, false
        ));

        book.chapters.forEach((chapter, ci) => {
          const pages = chapterPagesList[ci];
          if (!pages.length) return;
          pages.forEach((content, i) => {
            const eyebrow = i === 0 ? `<h2 class="page-title">${chapter.name}</h2><div class="ornament">෴</div>` : `<p class="page-eyebrow">${chapter.name}</p><div class="ornament">෴</div>`;
            const nav = `<div class="page-nav"><button type="button" class="back-btn" data-goto="2">&lsaquo; Contents</button></div>`;
            sheets.push(mk(eyebrow + content + nav, `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;"><div class="ornament">෴</div><p style="text-align:center; font-style:italic; color:var(--ink-faint); font-size:20px; font-weight:500;">${nextQuote()}</p><div class="ornament">෴</div></div>`, false, false));        
          });
        });

        sheets.push(mk(
          `<div class="ornament">෴</div><p style="font-family:var(--font-script); font-size:24px; color:var(--gold); text-align:center;">${book.endingMessage}</p><div class="ornament">෴</div>`,
          `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;"><p class="the-end">${book.backCoverTitle}</p><div class="cover-line" style="background:var(--gold-light); margin:14px auto;"></div><p class="back-script">${book.title}</p></div><p class="cover-kicker" style="margin-top:26px; font-size:10px; opacity:0.6; color:var(--gold);">&copy; MMXXVI</p>`,

        ));

          const count = chapterPageCounts[ci];
          for (let p = 0; p < count; p++) sheetLabels.push(chapter.name);
        });
        sheetLabels.push('End');

        return {html: sheets.join(''), labels: sheetLabels};
      }

        if (item.link) html += `<a class="plate-link" href="${item.link}">View the work &arr</a>`;

      function buildCarousel(images){
        carouselTrack.innerHTML = '';
        carouselDots.innerHTML = '';
        const n = images.length;
        if (n === 0) return;
        carouselAngle = 360 / n;

        images.forEach((img, i) => {
          const item = document.createElement('div');
          item.className = 'carousel-item';
          item.innerHTML = `<img src="${img.src}" alt="${img.caption || ('Gallery image' + (i + 1))}" loading="lazy"><p class="carousel-caption">${img.caption || ''}</p>`;
          item.addEventListener('click', () => goToSlide(i));
          carouselTrack.appendChild(item);

          const dot = document.createElement('button');
          dot.className = 'carousel-dot';
          dot.setAttribute('aria-label', 'Go to image ' + (i + 1));
          dot.addEventListener('click', () => goToSlide(i));
          carouselDots.appendChild(dot);
        });

        positionCarouselItems();
        updateCarousel();
      }

      function positionCarouselItems(){
        const items = carouselTrack.querySelectorAll('.carousel-item');
        const n = items.length;
        if (n === 0) return;
        const itemWidth = items[0].getBoundingClientRect().width || 220;
        const spacingMultiplier = n <= 4 ? 1.9 : 1.3;
        carouselRadius = n > 1 ? Math.round(((itemWidth / 2) / Math.tan(Math.PI / n)) * spacingMultiplier) : 0;
        items.forEach((item, i) => {
          item.style.transform = `translateX(-50%) rotateY(${i * carouselAngle}deg) translateZ(${carouselRadius}px)`;
        });
      }

      function updateCarousel(){
        const items = carouselTrack.querySelectorAll('.carousel-item');
        const dots = carouselDots.querySelectorAll('.carousel-dot');
        carouselTrack.style.transform = `rotateY(${-carouselCurrent * carouselAngle}deg)`;
        items.forEach((item, i) => item.classList.toggle('is-active', i === carouselCurrent));
        dots.forEach((dot, i) => dot.classList.toggle('is-active', i === carouselCurrent));
      }

      function goToSlide(i){
        const n = carouselTrack.children.length;
        if (n === 0) return;
        carouselCurrent = ((i % n) + n) % n;
        updateCarousel();
        restartCarouselAutoplay();
      }

      function carouselNextSlide(){
        goToSlide(carouselCurrent + 1);
      }

      function carouselPrevSlide(){
        goToSlide(carouselCurrent - 1);
      }

      document.getElementById('carouselNext').addEventListener('click', carouselNextSlide);
      document.getElementById('carouselPrev').addEventListener('click', carouselPrevSlide);

      let carouselTouchStartX = 0;
      carouselViewport.addEventListener('touchstart', (e) => {
        carouselTouchStartX = e.changedTouches[0].screenX;
        stopCarouselAutoplay();
      }, {passive:true});
      carouselViewport.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - carouselTouchStartX;
        if (Math.abs(dx) > 40){dx < 0 ? carouselNextSlide() : carouselPrevSlide();}
        restartCarouselAutoplay();
      }, {passive:true});

      function startCarouselAutoplay(){
        stopCarouselAutoplay();
        carouselAutoplayTimer = window.setInterval(carouselNextSlide, 4500);
      }

      function stopCarouselAutoplay(){
        if (carouselAutoplayTimer) window.clearInterval(carouselAutoplayTimer);
      }

      function restartCarouselAutoplay(){
        startCarouselAutoplay();
      }

      document.querySelector('.carousel-wrap').addEventListener('mouseenter', stopCarouselAutoplay);
      document.querySelector('.carousel-wrap').addEventListener('mouseleave', startCarouselAutoplay);

      window.addEventListener('resize', () => {
        positionCarouselItems();
        updateCarousel();
      });

      buildCarousel(galleryImages);
      startCarouselAutoplay();

      const SHORT_TEXT_MAX = 30;

      function splitIntoLetters(el){
        const text = el.textContent;
        const isShort = text.trim().length <= SHORT_TEXT_MAX;
        el.textContent = '';
        el.classList.add('split-text', isShort ? 'text-short' : 'text-long');
        el.classList.remove('reveal-item');
        const perLetterDelay = isShort ? 0.05 : 0.008;
        [...text].forEach((ch, i) => {
          const span = document.createElement('span');
          span.className = 'letter';
          span.textContent = ch === ' ' ? '\u00A0' : ch;
          const ty = (Math.random() * 30 + 15).toFixed(0);
          const rot = (Math.random() * 34 - 17).toFixed(0);
          span.style.setProperty('--ty', ty + 'px');
          span.style.setProperty('--rot', rot + 'deg');
          span.style.transitionDelay = (i * perLetterDelay) + 's';
          el.appendChild(span);
        });
      }
      document.querySelectorAll('#home h1, #home p, #about h2, #image h2').forEach(splitIntoLetters);

      document.querySelectorAll('.reveal-item').forEach(el => {
        if (el.classList.contains('split-text')) return;
        const len = el.textContent.trim().length;
        if (len > 0 && len <= SHORT_TEXT_MAX){
          el.classList.add('reveal-slow');
        } else if (len > SHORT_TEXT_MAX){
          el.classList.add('reveal-fast');
        }
      });

      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          entry.target.classList.toggle('in-view', entry.isIntersecting);
        });
      }, {threshold: 0.2});
      document.querySelectorAll('.landing-section').forEach(sec => revealObserver.observe(sec));

      const parallaxLayers = document.querySelectorAll('.parallax-layer');
      function updateParallax(){
        parallaxLayers.forEach(layer => {
          const rect = layer.parentElement.getBoundingClientRect();
          layer.style.transform = `translateY(${rect.top * 0.25}px)`;
        });
      }
      window.addEventListener('scroll', () => requestAnimationFrame(updateParallax), {passive:true});
      updateParallax();

      const navLinks = document.querySelectorAll('.nav-links a');
      const navObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting){
            navLinks.forEach(link => {
              link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
            });
          }
        });
      }, {threshold: 0.5});
      document.querySelectorAll('.landing-section').forEach(sec => navObserver.observe(sec));

      const magGlass = document.getElementById('magGlass');
      const magView = document.getElementById('magView');
      const ZOOM = 2.2;
      const LENS_R = 44;
      const LENS_CX = 50;
      const LENS_CY = 44;

      let isMagDragging = false;
      let magOffsetX = 0;
      let magAddedNoScroll = false;

      function refreshMagView(){
        const clone = document.body.cloneNode(true);
        clone.classList.remove('no-scroll');
        clone.querySelectorAll('.mag-glass, .reader-scene, .controls, .close-shelf-btn, .hint').forEach(el => el.remove());
        clone.querySelectorAll('.landing-section').forEach(sec => sec.classList.add('in-view'));

        const liveSections = document.querySelectorAll('.landing-section');
        const cloneSections = clone.querySelectorAll('.landing-section');
        liveSections.forEach((liveSec, i) => {
          const cloneSec = cloneSections[i];
          if (!cloneSec) return;
          const rect = liveSec.getBoundingClientRect();
          cloneSec.style.position = 'absolute';
          cloneSec.style.top = (rect.top + window.scrollY) + 'px';
          cloneSec.style.left = '0';
          cloneSec.style.width = '100%';
          cloneSec.style.minHeight = rect.height + 'px';
        });
        clone.style.position = 'relative';

        const liveNav = document.querySelector('.site-nav');
        const cloneNav = clone.querySelector('.site-nav');
        if (liveNav && cloneNav){
          const navRect = liveNav.getBoundingClientRect();
          cloneNav.style.position = 'absolute';
          cloneNav.style.top = (navRect.top + window.scrollY) + 'px';
          cloneNav.style.left = (navRect.left + window.scrollX) + 'px';
          cloneNav.style.right = 'auto';
          cloneNav.style.width = navRect.width + 'px';
        }

        magView.innerHTML = '';
        magView.appendChild(clone);
        magView.style.width = document.body.scrollWidth + 'px';
        magView.style.height = document.body.scrollHeight + 'px';
      }

      function updateMagLens(clientX, clientY){
        const glassLeft = clientX - magOffsetX;
        const glassTop = clientY - magOffsetY;

        magGlass.style.left = glassLeft + 'px';
        magGlass.style.top = glassTop + 'px';
        magGlass.style.right = 'auto';
        magGlass.style.bottom = 'auto';

        const lensCX = glassLeft + LENS_CX + window.scrollX;
        const lensCY = glassTop + LENS_CY + window.scrollY;

        magView.style.transform = `scale(${ZOOM})`;
        magView.style.left = (LENS_R - lensCX * ZOOM) + 'px';
        magView.style.top = (LENS_R - lensCY * ZOOM) + 'px';
      }

      function isOverDock(cx, cy){
        return (cx > window.innerWidth - 140 && cy > window.innerHeight - 140);
      }

      function snapMagToDock(){
        isMagDragging = false;
        magGlass.classList.remove('dragging');
        magGlass.style.left = 'auto';
        magGlass.style.top = 'auto';
        magGlass.style.right = '24px';
        magGlass.style.bottom = '24px';
        magView.innerHTML = '';;
        if (magAddedNoScroll) {
          document.body.classList.remove('no-scroll');
          magAddedNoScroll = false;
        }
      }

      function startMagDrag(e){
        e.preventDefault();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = magGlass.getBoundingClientRect();
        magOffsetX = cx - rect.left;
        magOffsetY = cy - rect.top;
        isMagDragging = true;
        magGlass.classList.add('dragging');
        if (!document.body.classList.contains('no-scroll')){
          document.body.classList.add('no-scroll');
          magAddedNoScroll = true;
        }
        refreshMagView();
        updateMagLens(cx, cy);
      }

      function onMagMove(e){
        if (!isMagDragging) return;
        e.preventDefault();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        updateMagLens(cx, cy);
      }

      function onMagEnd(e){
        if (!isMagDragging) return;
        const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

        if (isOverDock(cx, cy)){
          snapMagToDock();
        } else {
          isMagDragging = false;
          magGlass.classList.remove('dragging');
          if (magAddedNoScroll) {
            document.body.classList.remove('no-scroll');
            magAddedNoScroll = false;
          }
        }
      }

      let magScrollQueued = false;
      window.addEventListener('scroll', () => {
        if (!isMagDragging || magScrollQueued) return;
        magScrollQueued = true;
        requestAnimationFrame(() => {
          refreshMagView();
          magScrollQueued = false;  
        });
      }, {passive:true});

      magGlass.addEventListener('mousedown', startMagDrag);
      magGlass.addEventListener('touchstart', startMagDrag, {passive:false});
      document.addEventListener('mousemove', onMagMove);
      document.addEventListener('touchmove', onMagMove, {passive:false});
      document.addEventListener('mouseup', onMagEnd);
      document.addEventListener('touchend', onMagEnd, {passive:true});

      const _origOpenBook = openBook;
      openBook = function(book){
        _origOpenBook(book);
        if (isMagDragging) setTimeout(refreshMagView, 120);
      };

      if ('scrollrestoration' in history){
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
      if (location.hash)(
        'load', function(){
          window.scrollTo(0, 0);
        }
      );

      function makeFSFormImage(imgUrl, altText){
        return `<img class="fs-form-img" src="${imgUrl}" alt="${altText || 'Activity Form'}">`;
      }

      function makeFSSectionImage(imgUrl, altText){
        return `<img class="fs-section-img" src="${imgUrl}" alt="${altText || 'Section Header'}">`;
      }

      function pageBreak(){
        return '<!--PAGEBREAK-->';
      }

      function makeTable(opts){
        const {caption = '', columns = [], rows = []} = opts || {};

        const colgroupHTML = columns.some(c => c.width)
        ? `<colgroup>${columns.map(c => `<col${c.width ? ` style="width:${c.width}"` : ''}>`).join('')}</colgroup>`
          : '';
          
          const headHTML = columns.length
          ? `<thead><tr>${columns.map(c => 
            `<th${c.align ? ` data-align="${c.align}"` : ''}>${c.label || ''}</th>`
          ).join('')}</tr></head>`
          : '';

          const bodyHTML = rows.map(row => 
            `<tr>${row.map((cell, i) => {
              const isObj = cell && typeof cell === 'object';
              const value = isObj ? cell.value : cell;
              const align = (isObj && cell.align) || (columns[i] && columns[i].align) || '';
              return `<td${align ? ` data-align="${align}"` : ''}>${value != null ? value : ''}</td>`;
            }).join('')}</tr>`
          ).join('');

          return `<div class="book-table-wrap">
            <table class="book-table">
              ${caption ? `<caption>${caption}</caption>` : ''}
              ${colgroupHTML}
              ${headHTML}
              <tbody>${bodyHTML}</tbody>
              </table>
              </div>`;
      }

      function makeFSSectionHeader(title, emoji){
        const icon = emoji || '😎';
        return `
        <div class="fs-section-header">
          <span class="section-emoji" aria-hidden="true">${icon}</span>
          <div class="section-text">
            <span class="section-title">${title}</span>
            <span class="section-line"></span>
            </div>
            </div>`;
      }




    </script>
  </body>
</html>
