<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Renz I. Vertudazo (e-Portfolio)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --parchment:#f4e8d0;
      --parchment-shade:#e6d5b8;
      --parchment-dark:#d4c4a8;
      --ink:#2c1810;
      --ink-soft:#5d4037;
      --ink-faint:#8d6e63;
      --gold:#b8860b;
      --gold-light:#d4af37;
      --gold-pale:#e6c86e;
      --burgundy:#6a1b1b;
      --cover:#2c1810;
      --cover-light:#2e2723;
      --font-display:'Cinzel Decorative', serif;
      --font-title:'Cinzel', serif;
      --font-body:'Cormorant Garamond', serif;
      --font-script:'Tangerine', cursive;
      --page-w:clamp(500px, 100vw, 720px);
      --page-h:clamp(600px, 100vh, 830px);
    }
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    html{
      scroll-behavior:smooth;
    }
    html, body{
      width:100%;
      height:100%;
      background:#1a0f0a;
      font-family:var(--font-body);
      color:var(--ink);
    }
    body.no-scroll{
      overflow:hidden;
      height:100vh;
    }
    .site-nav{
      position:fixed;
      top:18px;
      left:18px;
      right:18px;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:nowrap;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .site-nav a{
      font-family:var(--font-title);
      font-size:11px;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:#ffffff;
      background:#3e2418;
      border:1px solid rgba(212,175,55,0.3);
      padding:8px 16px;
      border-radius:20px;
      text-decoration:none;
      backdrop-filter:blur(6px);
      transition:all 0.25s ease;
      white-space:nowrap;
    }
    .site-nav a:hover{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .site-nav a.active{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .nav-logo{
      display:flex;
      align-items:center;
      flex-shrink:0;
    }
    .logo-text{
      font-family:var(--font-display);
      font-size:18px;
      letter-spacing:0.12em;
      color:var(--gold-pale);
      text-shadow:0 2px 8px rgba(0,0,0,0.5);
      border:1px solid rgba(212,175,55,0.4);
      padding:6px 14px;
      border-radius:20px;
      background:rgba(26,15,10,0.6);
      backdrop-filter:blur(6px);
      transition:all 0.25s ease;
    }
    .nav-logo:hover .logo-text{
      background:rgba(212,175,55,0.15);
      border-color:var(--gold);
      color:var(--gold-light);
    }
    .logo-img{
      object-fit:cover;
      height:100px;
      width:100px;
      border-radius:6px;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
      background:white;
    }
    .nav-links{
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
      justify-content:flex-end;
    }
    .nav-links a{
      font-family:var(--font-title);
      font-size:15px;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:#ffffff;
      background:#3e2418;
      border:1px solid rgba(212,175,55,0.3);
      padding:8px 16px;
      border-radius:20px;
      text-decoration:none;
      backdrop-filter:blur(6px);
      transition:all 0.25s ease;
      white-space:wrap;
      font-weight:600;
    }
    .nav-links a:hover{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .nav-links a.active{
      background:#2c1810;
      border-color:var(--gold);
      color:#ffffff;
    }
    .landing-section{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:sticky;
      top:0;
      padding:100px 24px 60px;
      overflow:hidden;
    }
    #home{
      z-index:1;
    }
    #about{
      z-index:2;
    }
    #contents{
      z-index:3;
    }
    #image{
      z-index:4;
    }
    .parallax-layer{
      position:absolute;
      top:-20%;
      left:0;
      right:0;
      bottom:-20%;
      z-index:0;
      pointer-events:none;
      will-change:transform;
    }
    .landing-section > *:not(.parallax-layer){
      position:relative;
      z-index:1;
    }
    .landing-section .reveal-item{
      opacity:0;
      transform:translateY(34px);
      transition:opacity 0.3s ease, transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .landing-section .reveal-item.reveal-slow{
      transform:translateY(48px) scale(0.96);
      transition:opacity 0.9s ease, transform 0.9s cubic-bezier(0.22,1,0.36,1);
    }
    .landing-section .reveal-item.reveal-fast{
      transform:translateY(18px);
      transition:opacity 0.22s ease, transform 0.22s ease;
    }
    .landing-section.in-view .reveal-item{
      opacity:1;
      transform:translateY(0) scale(1);
    }
    .landing-section .reveal-item:nth-child(1){
      transition-delay:0.03s;
    }
    .landing-section .reveal-item:nth-child(2){
      transition-delay:0.1s;
    }
    .landing-section .reveal-item:nth-child(3){
      transition-delay:0.17s;
    }
    .landing-section .reveal-item:nth-child(4){
      transition-delay:0.24s;
    }
    .landing-section .reveal-item:nth-child(5){
      transition-delay:0.31s;
    }
    .landing-section.in-view .home-photo.reveal-item{
      transform:translateY(0) scale(1);
      opacity:1;
    }
    .split-text .letter{
      display:inline-block;
      opacity:0;
      transform:translateY(var(--ty, 26px)) rotate(var(--rot, 10deg)) scale(0.6);
      transition:opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .split-text.text-short .letter{
      transition:opacity 0.45s ease, transform 0.99s cubic-bezier(0.34,1.56,0.64,1);
    }
    .split-text.text-long .letter{
      transition:opacity 0.16s ease, transform 0.50s ease;
    }
    .landing-section.in-view .split-text .letter{
      opacity:1;
      transform:translateY(0) rotate(0deg) scale(1);
    }
    #home{
      text-align:center;
    }
    #home{
      background:
        radial-gradient(ellipse at 30% 20%, rgba(120,90,70,0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(90,65,50,0.6) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    .home-header{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:36px;
      flex-wrap:wrap;
    }
    .home-photo{
      width:clamp(250px, 20vw, 340px);
      height:clamp(860px, 100vw, 820px);
      border-radius:10px;
      object-fit:cover;
      object-position:cover-top;
      border:none;
      flex-shrink:0;
      transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), filter 0.35s ease;
      filter:
        drop-shadow(0 10px 20px rgba(255,90,56,0.9)),
        drop-shadow(0 4px 8px rgba(255,90,56,0.9));   
    }
    .home-photo:hover{
      transform:scale(1.05);
      filter:
        drop-shadow(0 14px 28px rgba(255,90,56,0.95))
        drop-shadow(0 6px 12px rgba(255,90,56,0.9));
    }
    .home-photo.reveal-item{
      transform:translateY(40px) scale(0.88);
      opacity:0;
      transition:opacity 0.7s ease, transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
      transition-delay:3.99s;
    }
    .home-text{
      text-align:left;
      min-width:0;
      flex:1 1 auto
    }
    #home h1, #home p{
      overflow-wrap:break-word;
      word-break:break-word;
    }
    #home h1{
      font-family:var(--font-display);
      font-size:clamp(28px, 3vw, 50px);
      color:var(--gold-pale);
      letter-spacing:0.04em;
      text-shadow:0 2px 12px rgba(0,0,0,0.6);
      margin-bottom:14px;
    }
    #home p{
      font-family:var(--font-script);
      font-size:clamp(22px, 3vw, 34px);
      color:var(--gold-light);
      max-width:600px;
    }
    @media (max-width:480px){
      .home-header{
        gap:16px;
        align-items:flex-start;
      }
      .home-photo{
        width:clamp(110px, 34vw, 150px);
        height:clamp(180px, 58vw, 260px);
      }
      #home h1{
        font-size:clamp(16px, 2vw, 24px);
      }
      #home p{
        font-size:clamp(14px, 2vw, 20px);
      }
    }
    #about{
      text-align:center;
    }
    #about .parallax-layer{
      background:
        radial-gradient(ellipse at 70% 20%, rgba(120,90,70,0.5) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    #about h2{
      font-family:var(--font-display);
      font-size:clamp(26px, 4.5vw, 42px);
      color:var(--gold-pale);
      letter-spacing:0.06em;
      margin-bottom:18px;
    }
    #image h2{
      font-family:var(--font-display);
      font-size:clamp(26px, 4.5vw, 42px);
      color:var(--gold-pale);
      letter-spacing:0.06em;
      margin-bottom:50px;
    }
    #about p{
      font-family:var(--font-body);
      font-size:clamp(16px, 2vw, 20px);
      color:var(--parchment-dark, #ddd);
      max-width:640px;
      line-height:1.7;
    }
    #contents{
      padding:0;
      min-height:100vh;
      overflow:visible;
    }
    #contents .bookshelf-scene{
      min-height:100vh;
    }
    #image{
      text-align:center;
    }
    #image .parallax-layer{
      background:
        radial-gradient(ellipse at 30% 80%, rgba(120,90,70,0.5) 0%, transparent 50%),
        linear-gradient(180deg, #4a3020 0%, #5c4030 50%, #4a3020 100%);
    }
    .carousel-wrap{
      position:relative;
      width:100%;
      max-width:900px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(6px, 2vw, 16px);
    }
    .carousel-viewport{
      position:relative;
      width:min(70vw, 620px);
      height:clamp(240px, 40vw, 380px);
      perspective:1800px;
      overflow:visible;
    }
    .carousel-track{
      position:absolute;
      inset:0;
      transform-style:preserve-3d;
      transition:transform 0.7s cubic-bezier(0.25,1,0.5,1);
    }
    .carousel-item{
      position:absolute;
      top:0;
      left:50%;
      width:clamp(150px, 24vw, 260px);
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      cursor:pointer;
      transition:opacity 0.6s ease, filter 0.6s ease;
      backface-visibility:hidden;
    }
    .carousel-item img{
      width:100%;
      height:78%;
      object-fit:cover;
      border-radius:6px;
      border:2px solid var(--gold);
      box-shadow:0 16px 34px rgba(0,0,0,0.5);
      background:#2c1810;
    }
    .carousel-item .carousel-caption{
      margin-top:10px;
      font-family:var(--font-title);
      font-size:clamp(11px, 1.6vw, 14px);
      letter-spacing:0.04em;
      color:var(--gold-pale);
      text-align:center;
      text-shadow:0 2px 8px rgba(0,0,0,0.6);
    }
    .carousel-item:not(.is-active){
      opacity:0.4;
      filter:brightness(0.55) saturate(0.7);
    }
    .carousel-item.is-active{
      opacity:1;
      filter:none;
    }
    .carousel-item.is-active img{
      box-shadow:0 20px 46px rgba(0,0,0,0.65), 0 0 0 3px rgba(212,175,55,0.35);
    }
    .carousel-arrow{
      flex-shrink:0;
      width:44px;
      height:44px;
      border-radius:50%;
      border:1px solid rgba(212,175,55,0.4);
      background:rgba(26,15,10,0.6);
      color:var(--gold-pale);
      font-size:18px;
      line-height:1;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all 0.25s ease;
      backdrop-filter:blur(6px);
    }
    .carousel-arrow:hover{
      background:rgba(212,175,55,0.18); 
      border-color:var(--gold);
      color:var(--gold-light);
      transform:scale(1.08);
    }
    .carousel-dots{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:8px;
      margin-top:22px;
      position:relative;
      z-index:1;
    }
    .carousel-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:rgba(212,175,55,0.3);
      border:1px solid rgba(212,175,55,0.5);
      cursor:pointer;
      padding:0;
      transition:all 0.25s ease;
    }
    .carousel-dot.is-active{
      background:var(--gold);
      transform:scale(1.3);
    }
    @media (max-width:640px){
      .carousel-viewport{
        width:min(85vw, 420px);
        height:clamp(260px, 55vw, 360px);
      }
      .carousel-arrow{
        width:34px;
        height:34px;
        font-size:14px;
      }
      .carousel-item{
        width:min(65vw, 240px);
      }
      .carousel-wrap{
        gap:8px;
      }
    }   
    .bookshelf-scene{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(62,39,35,0.5) 0% transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(44,24,16,0.6) 0% transparent 50%),
        linear-gradient(180deg, #1a0f0a 0%, #2c1810 40%, #1a0f0a 100%);
      position:relative;
      transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
    }
    .bookshelf-scene.hidden{
      opacity:0;
      pointer-events:none;
      transform:scale(0.92);
      filter:blur(8px);
    }
    .bookshelf-scene::before{
      content:'';
      position:absolute;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity:0.4;
      pointer-events:none;
    }
    .shelf-header{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-header h1{
      font-family:var(--font-display);
      font-size:clamp(28px, 5vw, 48px);
      color:var(--gold-pale);
      letter-spacing:0.1em; 
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      text-align:center;
    }
    .shelf-header p{
      font-family:var(--font-script);
      font-size:clamp(22px, 2.5vw, 34px);
      color:var(--gold-light);
      margin-top:4px;
    }
    .shelf-container{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-row{
      position:relative;
      width:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:clamp(8px, 2vw, 24px);
      padding:20px 30px 14px;
      background:
        linear-gradient(180deg, rgba(62,39,35,0) 0%, rgba(62,39,35,0.4) 100%),
        linear-gradient(90deg, #3e2723 0%, #5d4037 20%, #4e342e 50%, #5d4037 80%, #3e2723 100%);
      border-radius:4px;
      box-shadow:inset 0 4px 8px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.5);
    }
    .shelf-row::after{
      content:'';
      position:absolute;
      bottom:-10px;
      left:0;
      right:0;
      height:10px;
      background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
      border-radius:0 0 4px 4px;
    }
    .book-spine{
      position:relative;
      width:clamp(44px, 8vw, 72px);
      height:clamp(160px, 28vh, 260px);
      border-radius:3px 3px 0 0;
      cursor:pointer;
      transform-origin:bottom center;
      transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 6px 10px;
      text-align:center;
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.1), inset -2px 0 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.3);
      overflow:hidden;
    }
    .book-spine::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine::after{
      content:'';
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:2px;
      height:100%;
      background:linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine:hover{
      transform:translateY(-18px) scale(1.05);
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.12), inset -2px 0 4px rgba(0,0,0,0.15), 0 18px 40px rgba(0,0,0,0.5);
      filter:brightness(1.15);
      z-index:10;
    }
    .book-spine:active{
      transform:translateY(-10px) scale(1.02);
    }
    .spine-episode{
      font-family:var(--font-title);
      font-size:clamp(8px, 1.2vw, 11px);
      letter-spacing:0.15em;
      text-transform:uppercase;
      opacity:0.85;
      margin-bottom:8px;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex-shrink:0;
    }
    .spine-title{
      font-family:var(--font-display);
      font-size:clamp(11px, 1.8vw, 16px);
      font-weight:700;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex:1;
      display:flex;
      align-items:center;
      line-height:1.3;
      text-shadow:0 1px 3px rgba(0,0,0,0.4);
    }
    .spine-ornament{
      font-size:14px;
      margin-top:auto;
      opacity:0.7;
    }
    .spine-band{
      position:absolute;
      left:0;
      right:0;
      height:3px;
      background:rgba(255,255,255,0.15);
    }
    .spine-band.top{
      top:28px;
    }
    .spine-band.bottom{
      bottom:28px;
    }
    .palette-classic{
      background:linear-gradient(90deg, #3e2723, #5d4037, #3e2723);
      color:#e6c86e;
      border:1px solid #5d4037;
    }
    .palette-ocean{
      background:linear-gradient(90deg, #0a2540, #154360, #0a2540);
      color:#7fdbda;
      border:1px solid #1a5276;
    }
    .palette-forest{
      background:linear-gradient(90deg, #1b4332, #2d6a4f, #1b4332);
      color:#d8f3dc;
      border:1px solid #40916c;
    }
    @keyframes fadeInDown{
      from{ opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);}
    }
    @keyframes fadeInUp{
      from{ opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);}
    }
    .book-spine{
      animation:fadeInUp 0.7s ease backwards;
    }
    .reader-scene{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:

            `<p><b>Write your observation report here.</b></p>`,
            `<p><b>Name of this school observed <u>University of Camarines Norte – Abaño Campus</u></b> <br> <b>Location of the school <u>Barangay 2 – Daet Camarines Norte</u></b> <br> <b>Date of visit <u>August 11, 2026</u></b></p>`,
            `<p>Is the classroom of Grade 10 – Masayahin conducive to learning? No, because the seat arrangement of the students is not flexible to other indoor activities of the class. There is no copy of the National Anthem at the upper left-hand corner and on the other side, also no framed copy of the Pledge of Allegiance to the Philippine Flag. Profile of Students is missing. Proper ventilation and lighting are not prioritized. The classroom shared desk and layout do not have enough space to do group work in spacious areas. The</p>`,
            pageBreak(),
            `<p>bulletin board contains information about climate change, yet the other bulletin board on the left side has no information therefore, it can be used for displaying the works of the learners. There are still things within the classroom that need improvement, but since teachers are already overloaded with duties, these tasks can be done gradually, one by one or little by little with the help of the students. The classroom needs improvement so that students can breathe and move around comfortably during activities. As Susan Brooks said, “It is the learning environment that determines a student's success and motivation.”</p>`,
            `<br>`,
            `<br>`,
            makeFSSectionHeader('ANALYZE', '🔍'),
            `<p>How did the school campus and school in particular impact the learning of these students going to school? What are the conclusions?</p>`,
            `<p style="text-indent:15px;"><u>School campus and school in particular impact the learning of these students by giving them knowledge about various disciplines of science, mathematics, english and other subjects that they can use to be competitive in international aspects.</u></p>`,
            `<br>`,
            `<p>How does this relate to your knowledge of child and adolescent development? How does this relate to your knowledge of facilitating learning?</p>`,
            `<p style="text-indent:15px;"><u>Through various lessons, students learn about reality based on their own experiences. By employing the right teaching strategies, they find the lesson content more enjoyable, even when the material is sometimes boring or information heavy.</u></p>`,
            pageBreak(),
            makeFSSectionHeader('REFLECT', '💭'),
            `<p>1) Would you like to teach in the school environment you just observe? Why? Why not?</p>`,
            `<p style="text-indent:15px;"><u>Of course, it as an opportunity to teach in the school environment I just observe. After all, who knows? Maybe those cheerful Grade 10 students are waiting for me to be part of their high school journey, even if their classroom isn't exactly the best. As Clint Eastwood said, “Sometimes if you want to see change for the better, you have to take things into your own hands.”</u></p>`,
            `<br>`,
            `<p>2) What kind of school campus is conducive to learning?</p>`,
            `<p style="text-indent:15px;"><u>A school campus conducive to learning should promote emotional well-being and social development, ensuring that students wear smiles and show excitement before and after school. As Karl Urban said, “Nothing beats a great smile.”</u></p>`,
            `<br>`,
            `<p>3) What kind of classroom is conducive to learning?</p>`,
            `<p style="text-indent:15px;"><u>A classroom conducive to learning must be a safe space for students to open up, free from bullying, even amidst cultural diversity. It should be well-ventilated and allow students the freedom to explore their curiosity, supported by proper guidance and instruction. As Marcus Tullius Cicero said, "The safety of the people shall be the highestlaw."</u></p>`,
            `<br>`,
            `<p>4) In the future, how can you accomplish your answer in number 3?</p>`,
            `<p style="text-indent:15px;"><u>In the future, I will be able to provide a safe space and proper guidance for my students by creating a web-based application featuring various activities and lessons they can complete independently, while also prioritizing their emotional well-being before and after the tasks. As Dr. Mike Ribble stated, “Digital citizenship is more than just a teaching tool, it is a way to prepare students for a technologydriven society.”</u></p>`,
            `<br>`,
            `<p>5) Write your additional learnings and insights here.</p>`,
            `<p style="text-indent:15px;"><u>In the coming years, by the time I become a full-fledged teacher and have successfully developed and refined the web-based application I am currently building, will the Philippines be ready for the changes that will unfold in our country's education system? As Albert Einstein said, “I have no special talents, I am just passionately curious.”</u></p>`,

            `<p>What experiences do you remember from when you were still studying?</p>`,
            `<br>`,
            `<p>Reflecting on my journey, I recall that during my elementary school days, our classroom was filled with interaction whenever we played games like “texts”, “pogs”, Chinese garter, “habulan”, “taguan”, “agawan-base”, Enter-in, “luksongtinik”, jump rope, and other traditional Filipino games. Through communication, we got to know each other; we learned to work together, understand one another's needs, and cooperate in keeping our classroom both inside and out, neat and clean. One of the effects of this communication was forming friendships with the other section, since everyone found out that our classmate's crush was in that section. A simple feeling evolved into unity and a bond between two classes, not for the sake of a romantic relationship, but to strengthen our connection, briefly forget the mockery of others, and pass the time while within our second home.</p>`,
            `<br>`,
            `<p>When I entered junior high school, I was no longer classmates with the people I used to be with. I am no longer with the fun-loving friends I used to hang out with anytime, anywhere, both inside and outside of school. I realized here that everyone has their own distinct groups, and you can't really join their circle if their interests don't align with yours. However, despite the existence of various friendship groups within a section or classroom, everyone gets along well during group activities and random group assignments, and the tasks are divided equally. This is where mutual acceptance comes in, despite the differences in the cultures to which they belong. Mutual acceptance paved the way for successfully defending our research, bringing “Ibong Adarna” to life, performing “Florante at Laura” at the covered court, and experiencing the art of storytelling. When the pandemic hit the Philippines, the physical interactions began to transform into digital communication and friendships that emerged through tiktok, instagram, facebook, and other social media platforms. Social media platforms did help make my studies more flexible, but they also</p>`,
            `<p>significantly affected my social, emotional, and mental health. I gradually became addicted to online games and endless scrolling; I stopped leaving my room, failed to stick to a proper schedule, avoided working on modules whenever I saw walls of text or numbers, and much more. Owning a cellphone became a major challenge for me due to the distractions and entertainment it brings.</p>`,
            `<br>`,
            `<p>As I continued my journey through senior high school, the community I was connected with, both personally and through the pages I joined on online platforms kept growing. Every time I enter and leave school, I see many workers who are exhausted and sleep-deprived, each with a unique life experience based on their own stories. When I opened my online account, my newsfeed was filled with various statuses, emotions, and posts. It was then that I realized school helps me grow in the direction I want for myself. These were the years that taught me to grow with the right attitude and to pursue my dreams, knowing that no one else would make them a reality for everyone has different dreams, and different strategies to achieve them.</p>`,
            `<br>`,
            `<p>When I started college, specifically during my freshman year, I was truly amazed, because I had made it to college, the first in the family to do so. But as I spend more time in college, it really gets draining. Even if you get a full night's sleep, it’s still exhausting by the time you get to the classroom. Despite the situation, everyone around me including teachers, classmates, strangers, online friends, and others still motivated me to keep going. These situations drove me to keep going, even when I wasn't in the mood, even when I didn't want to do it, and even when there were forces trying to pull me down. I pressed on because I believed that the people around me who wanted to see me succeed would support me in the years and decades to come.</p>`,
            `<br>`,
            `<p>Therefore, based on my observations and experiences the characteristics of a school environment that promotes learning should prioritize communication, embrace acceptance, expand the connections for growth, and remind everyone that through the lows and the highs your people will not betray you. So, what are you waiting for? Focus on your academics and build a system with others. This will help you grow and discover who you are. As Julius Caesar said, “Experience is the best teacher.”</p>`,
            pageBreak(),

            `<br>`,
            `<br>`,
            `<br>`,
            `<p style="text-indent:15px;"><u>My favorite theory of development is Piaget's Theory of Development. Based on the article of McLeod, S. (2025) entitled Piaget’s Theory and Stages of Cognitive Development. Jean Piaget’s theory describes cognitive development as a progression through four distinct stages, where children’s thinking becomes progressively more advanced and nuanced. During the Sensorimotor Stage (Birth to 2 Years), children learn about the world entirely through their senses and physical actions (like touching, grasping, and looking). By coordinating these sensory and motor experiences, they begin to construct schemas (basic knowledge units). During this time, they develop the key concept of object permanence – the understanding that objects continue to exist even when they can’t be seen. In the Preoperational Stage (2 to 7 Years), children start using symbols and language but struggle with logical thinking. They can’t yet understand conservation, meaning they think a tall, thin glass holds more water than a short, wide one.</u></p>`,
            `<br>`,
            `<p><u>They may also be egocentric, meaning they find it difficult to see things from others’ perspectives. In the Concrete Operational Stage (7 to 11 Years), children become more logical in their thinking. They can understand concepts like conservation, realizing that quantity doesn’t change even if the appearance of an object does. They also begin to think about others’ thoughts and feelings more realistically. Lastly, once they reached the Formal Operational Stage (11+ Years), adolescents develop the ability to think abstractly and solve hypothetical problems. This means they can now tackle “whatif” scenarios and understand concepts that aren’t tied to physical reality. They can now reason about complex concepts like ethics, science, and mathematics, thinking systematically and forming hypotheses.</u></p>`,

      function paginateContent(chunks){
        const measure = document.getElementById('measure-container');
        const isMobile = window.innerWidth <= 720;
        const paddingH = isMobile ? 36 : 72;
        const paddingV = isMobile ? 104 : 72;
        const pageW = (document.querySelector('.book-wrap')?.offsetWidth || 680) / 2 - paddingH;
        const headerReserve = 80;
        const navReserve = 48;
        const pageH = (document.querySelector('.book-wrap')?.offsetHeight || 530) - paddingV - headerReserve - navReserve;
        measure.style.cssText = `position:fixed; left:-9999px; width:${pageW}px; height:${pageH}px; overflow:hidden; visibility:hidden; pointer-events:none; display:flex; flex-direction:column;`;

        const pages = [];
        let current = '';
        for (let i = 0; i < chunks.length; i++){
          const chunk = chunks[i];
          if (chunk === '<!--PAGEBREAK-->'){
            if (current !== ''){
              pages.push(current);
              current = '';
            }
            continue;
          }
          const test = current + chunks[i];
          measure.innerHTML = test;
          if (measure.scrollHeight > pageH && current !== ''){
            pages.push(current);
            current = chunks[i];
          } else {
            current = test;
          }
        }
        if (current) pages.push(current);
        if (!pages.length) pages.push('');
        measure.innerHTML = '';
        return pages;
      }

        sheets.push(mk(

          if (!pages.length) return;
          pages.forEach((content, i) => {
            const eyebrow = i === 0 ? `<h2 class="page-title">${chapter.name}</h2><div class="ornament">෴</div>` : `<p class="page-eyebrow">${chapter.name}</p><div class="ornament">෴</div>`;
            const nav = `<div class="page-nav"><button type="button" class="back-btn" data-goto="2">&lsaquo; Contents</button></div>`;
            sheets.push(mk(eyebrow + content + nav, `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;"><div class="ornament">෴</div><p style="text-align:center; font-style:italic; color:var(--ink-faint); font-size:20px; font-weight:500;">${nextQuote()}</p><div class="ornament">෴</div></div>`, false, false));        
          });
        });

        sheets.push(mk(
          `<div class="ornament">෴</div><p style="font-family:var(--font-script); font-size:24px; color:var(--gold); text-align:center;">${book.endingMessage}</p><div class="ornament">෴</div>`,
          `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;"><p class="the-end">${book.backCoverTitle}</p><div class="cover-line" style="background:var(--gold-light); margin:14px auto;"></div><p class="back-script">${book.title}</p></div><p class="cover-kicker" style="margin-top:26px; font-size:10px; opacity:0.6; color:var(--gold);">&copy; MMXXVI</p>`,
          false, true
        ));

        const sheetLabels = ['Cover', 'Contents'];
        book.chapters.forEach((chapter, ci) => {
          const count = chapterPageCounts[ci];
          for (let p = 0; p < count; p++) sheetLabels.push(chapter.name);
        });
        sheetLabels.push('End');

        return {html: sheets.join(''), labels: sheetLabels};
      }

      let currentBook = null; 
      let sheets = [];
      let current = 0;
      let total = 0;
      let animating = false;

      function openBook(book){
        currentBook = book;
        applyPalette(book.palette);
        const built = buildBookHTML(book);
        document.getElementById('book').innerHTML = built.html;
        sheetLabels = built.labels;
        sheets = Array.from(document.querySelectorAll('.sheet'));
        total = sheets.length;
        current = 0;
        animating = false;

        document.getElementById('bookshelfScene').classList.add('hidden');
        document.getElementById('readerScene').classList.add('active');
        document.getElementById('closeShelfBtn').classList.add('visible');
        document.body.classList.add('no-scroll');

        render();
      }

      function closeBook(){
        document.getElementById('bookshelfScene').classList.remove('hidden');
        document.getElementById('readerScene').classList.remove('active');
        document.getElementById('closeShelfBtn').classList.remove('visible');
        document.body.classList.remove('no-scroll');
        document.getElementById('book').innerHTML = '';
        currentBook = null;
        sheetLabels = [];
      }

      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      const indicator = document.getElementById('pageIndicator');
      const hint = document.getElementById('hint');
      const bookWrap = document.querySelector('.book-wrap');

      function render(){
        sheets.forEach((sheet, i) => {
          const front = sheet.querySelector('.face-front');
          const back = sheet.querySelector('.face-back');
          if (i < current){
            sheet.classList.add('sheet-flipped');
            sheet.style.zIndex = total + i;
            if (front) front.style.pointerEvents = 'none';
            if (back) back.style.pointerEvents = 'auto';
          } else { 
            sheet.classList.remove('sheet-flipped');
            sheet.style.zIndex = total - i;
            if (front) front.style.pointerEvents = 'auto';
            if (back) back.style.pointerEvents = 'none';
          }
        });
        btnPrev.disabled = current === 0;
        btnNext.disabled = current === total;
        indicator.textContent = sheetLabels[current] || (current >= total ? 'End' : current + 1);
        if (current > 0) hint.style.opacity = '0';
      }

      function turnTo(target){
        if (animating || target === current || target < 0 || target > total) return;
        animating = true;
        current = target;
        render();
        window.setTimeout(() => {animating = false;}, 950);
      }

      function renderChunk(item){
        if (typeof item === 'string') return item;
        let html = `<article class="plate">`;
        if (item.fig) html += `<span class="plate-fig">${item.fig}</span>`;
        if (item.title) html += `<h3 class="plate-title">${item.title}</h3>`;
        if (item.image) html += `<figure class="plate-figure"><img class="plate-img" src="${item.image}" alt="${item.title || ''} screenshot" loading="lazy"><figcaption>${item.imageCaption || ''}</figcaption></figure>`;
        if (item.image_2) html += `<figure class="plate-figure"><img class="plate-img-2" style="justify-content:center; align-items:center; text-align:center;" src="${item.image_2}" alt="${item.title || ''} screenshot" loading="lazy"><figcaption>${item.imageCaption || ''}</figcaption></figure>`;
        if (item.desc) html += `<p class="plate-desc">${item.desc}</p>`;
        if (item.stack) html += `<p class="plate-stack">${item.stack}</p>`;
        if (item.link) html += `<a class="plate-link" href="${item.link}">View the work &arr</a>`;
        html += `</article>`;
        return html;
      }

      function next(){
        turnTo(current + 1);
      }
      function prev(){
        turnTo(current - 1);
      }

      btnNext.addEventListener('click', (e) => {e.stopPropagation(); next(); });
      btnPrev.addEventListener('click', (e) => {e.stopPropagation(); prev(); });

      document.addEventListener('click', (e) => {
        const navBtn = e.target.closest('.toc-item, .back-btn');
        if (navBtn) {
          e.stopPropagation();
          e.preventDefault();
          const target = parseInt(navBtn.dataset.goto, 10);
          if (!isNaN(target)) turnTo(target);
        }
      });

      window.addEventListener('keydown', (e) => {

      let touchStartX = 0, touchStartY = 0;
      bookWrap.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, {passive:true});

      bookWrap.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
          if (dx < 0) next(); else prev();

      const carouselTrack = document.getElementById('carouselTrack');
      const carouselDots = document.getElementById('carouselDots');
      const carouselViewport = document.querySelector('.carousel-viewport');
      let carouselCurrent = 0;
      let carouselRadius = 0;
      let carouselAngle = 0;
      let carouselAutoplayTimer = null;

      function buildCarousel(images){
        carouselTrack.innerHTML = '';
        carouselDots.innerHTML = '';
        const n = images.length;
        if (n === 0) return;
        carouselAngle = 360 / n;

        images.forEach((img, i) => {
          const item = document.createElement('div');
          item.className = 'carousel-item';
          item.innerHTML = `<img src="${img.src}" alt="${img.caption || ('Gallery image' + (i + 1))}" loading="lazy"><p class="carousel-caption">${img.caption || ''}</p>`;
          item.addEventListener('click', () => goToSlide(i));
          carouselTrack.appendChild(item);

          const dot = document.createElement('button');
          dot.className = 'carousel-dot';
          dot.setAttribute('aria-label', 'Go to image ' + (i + 1));
          dot.addEventListener('click', () => goToSlide(i));
          carouselDots.appendChild(dot);
        });

        positionCarouselItems();
        updateCarousel();
      }

      function positionCarouselItems(){
        const items = carouselTrack.querySelectorAll('.carousel-item');
        const n = items.length;
        if (n === 0) return;
        const itemWidth = items[0].getBoundingClientRect().width || 220;
        const spacingMultiplier = n <= 4 ? 1.9 : 1.3;
        carouselRadius = n > 1 ? Math.round(((itemWidth / 2) / Math.tan(Math.PI / n)) * spacingMultiplier) : 0;
        items.forEach((item, i) => {
          item.style.transform = `translateX(-50%) rotateY(${i * carouselAngle}deg) translateZ(${carouselRadius}px)`;
        });
      }

      function updateCarousel(){
        const items = carouselTrack.querySelectorAll('.carousel-item');
        const dots = carouselDots.querySelectorAll('.carousel-dot');
        carouselTrack.style.transform = `rotateY(${-carouselCurrent * carouselAngle}deg)`;
        items.forEach((item, i) => item.classList.toggle('is-active', i === carouselCurrent));
        dots.forEach((dot, i) => dot.classList.toggle('is-active', i === carouselCurrent));
      }

      function goToSlide(i){
        const n = carouselTrack.children.length;
        if (n === 0) return;
        carouselCurrent = ((i % n) + n) % n;
        updateCarousel();
        restartCarouselAutoplay();
      }

      function carouselNextSlide(){
        goToSlide(carouselCurrent + 1);
      }

      function carouselPrevSlide(){
        goToSlide(carouselCurrent - 1);
      }

      document.getElementById('carouselNext').addEventListener('click', carouselNextSlide);
      document.getElementById('carouselPrev').addEventListener('click', carouselPrevSlide);

      let carouselTouchStartX = 0;
      carouselViewport.addEventListener('touchstart', (e) => {
        carouselTouchStartX = e.changedTouches[0].screenX;
        stopCarouselAutoplay();
      }, {passive:true});
      carouselViewport.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].screenX - carouselTouchStartX;
        if (Math.abs(dx) > 40){dx < 0 ? carouselNextSlide() : carouselPrevSlide();}
        restartCarouselAutoplay();
      }, {passive:true});

      function startCarouselAutoplay(){
        stopCarouselAutoplay();
        carouselAutoplayTimer = window.setInterval(carouselNextSlide, 4500);
      }

      function stopCarouselAutoplay(){
        if (carouselAutoplayTimer) window.clearInterval(carouselAutoplayTimer);
      }

      function restartCarouselAutoplay(){
        startCarouselAutoplay();
      }

      document.querySelector('.carousel-wrap').addEventListener('mouseenter', stopCarouselAutoplay);
      document.querySelector('.carousel-wrap').addEventListener('mouseleave', startCarouselAutoplay);

      window.addEventListener('resize', () => {
        positionCarouselItems();
        updateCarousel();
      });

      buildCarousel(galleryImages);
      startCarouselAutoplay();

      const SHORT_TEXT_MAX = 30;

      function splitIntoLetters(el){
        const text = el.textContent;
        const isShort = text.trim().length <= SHORT_TEXT_MAX;
        el.textContent = '';
        el.classList.add('split-text', isShort ? 'text-short' : 'text-long');
        el.classList.remove('reveal-item');
        const perLetterDelay = isShort ? 0.05 : 0.008;
        [...text].forEach((ch, i) => {
          const span = document.createElement('span');
          span.className = 'letter';
          span.textContent = ch === ' ' ? '\u00A0' : ch;
          const ty = (Math.random() * 30 + 15).toFixed(0);
          const rot = (Math.random() * 34 - 17).toFixed(0);
          span.style.setProperty('--ty', ty + 'px');
          span.style.setProperty('--rot', rot + 'deg');
          span.style.transitionDelay = (i * perLetterDelay) + 's';
          el.appendChild(span);
        });
      }
      document.querySelectorAll('#home h1, #home p, #about h2, #image h2').forEach(splitIntoLetters);

      document.querySelectorAll('.reveal-item').forEach(el => {
        if (el.classList.contains('split-text')) return;
        const len = el.textContent.trim().length;
        if (len > 0 && len <= SHORT_TEXT_MAX){
          el.classList.add('reveal-slow');
        } else if (len > SHORT_TEXT_MAX){
          el.classList.add('reveal-fast');
        }
      });

      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          entry.target.classList.toggle('in-view', entry.isIntersecting);
        });
      }, {threshold: 0.2});
      document.querySelectorAll('.landing-section').forEach(sec => revealObserver.observe(sec));

      const parallaxLayers = document.querySelectorAll('.parallax-layer');
      function updateParallax(){
        parallaxLayers.forEach(layer => {
          const rect = layer.parentElement.getBoundingClientRect();
          layer.style.transform = `translateY(${rect.top * 0.25}px)`;
        });
      }
      window.addEventListener('scroll', () => requestAnimationFrame(updateParallax), {passive:true});
      updateParallax();

      const navLinks = document.querySelectorAll('.nav-links a');
      const navObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting){
            navLinks.forEach(link => {
              link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
            });
          }
        });
      }, {threshold: 0.5});
      document.querySelectorAll('.landing-section').forEach(sec => navObserver.observe(sec));

      const magGlass = document.getElementById('magGlass');
      const magView = document.getElementById('magView');
      const ZOOM = 2.2;
      const LENS_R = 44;
      const LENS_CX = 50;
      const LENS_CY = 44;

      let isMagDragging = false;
      let magOffsetX = 0;
      let magAddedNoScroll = false;

      function refreshMagView(){
        const clone = document.body.cloneNode(true);
        clone.classList.remove('no-scroll');
        clone.querySelectorAll('.mag-glass, .reader-scene, .controls, .close-shelf-btn, .hint').forEach(el => el.remove());
        clone.querySelectorAll('.landing-section').forEach(sec => sec.classList.add('in-view'));

        const liveSections = document.querySelectorAll('.landing-section');
        const cloneSections = clone.querySelectorAll('.landing-section');
        liveSections.forEach((liveSec, i) => {
          const cloneSec = cloneSections[i];
          if (!cloneSec) return;
          const rect = liveSec.getBoundingClientRect();
          cloneSec.style.position = 'absolute';
          cloneSec.style.top = (rect.top + window.scrollY) + 'px';
          cloneSec.style.left = '0';
          cloneSec.style.width = '100%';
          cloneSec.style.minHeight = rect.height + 'px';
        });
        clone.style.position = 'relative';

        const liveNav = document.querySelector('.site-nav');
        const cloneNav = clone.querySelector('.site-nav');
        if (liveNav && cloneNav){
          const navRect = liveNav.getBoundingClientRect();
          cloneNav.style.position = 'absolute';
          cloneNav.style.top = (navRect.top + window.scrollY) + 'px';
          cloneNav.style.left = (navRect.left + window.scrollX) + 'px';
          cloneNav.style.right = 'auto';
          cloneNav.style.width = navRect.width + 'px';
        }

        magView.innerHTML = '';
        magView.appendChild(clone);
        magView.style.width = document.body.scrollWidth + 'px';
        magView.style.height = document.body.scrollHeight + 'px';
      }

      function updateMagLens(clientX, clientY){
        const glassLeft = clientX - magOffsetX;
        const glassTop = clientY - magOffsetY;

        magGlass.style.left = glassLeft + 'px';
        magGlass.style.top = glassTop + 'px';
        magGlass.style.right = 'auto';
        magGlass.style.bottom = 'auto';

        const lensCX = glassLeft + LENS_CX + window.scrollX;
        const lensCY = glassTop + LENS_CY + window.scrollY;

        magView.style.transform = `scale(${ZOOM})`;
        magView.style.left = (LENS_R - lensCX * ZOOM) + 'px';
        magView.style.top = (LENS_R - lensCY * ZOOM) + 'px';
      }

      function isOverDock(cx, cy){
        return (cx > window.innerWidth - 140 && cy > window.innerHeight - 140);
      }

      function snapMagToDock(){
        isMagDragging = false;
        magGlass.classList.remove('dragging');
        magGlass.style.left = 'auto';
        magGlass.style.top = 'auto';
        magGlass.style.right = '24px';
        magGlass.style.bottom = '24px';
        magView.innerHTML = '';;
        if (magAddedNoScroll) {
          document.body.classList.remove('no-scroll');
          magAddedNoScroll = false;
        }
      }

      function startMagDrag(e){
        e.preventDefault();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = magGlass.getBoundingClientRect();
        magOffsetX = cx - rect.left;
        magOffsetY = cy - rect.top;
        isMagDragging = true;
        magGlass.classList.add('dragging');
        if (!document.body.classList.contains('no-scroll')){
          document.body.classList.add('no-scroll');
          magAddedNoScroll = true;
        }
        refreshMagView();
        updateMagLens(cx, cy);
      }

      function onMagMove(e){
        if (!isMagDragging) return;
        e.preventDefault();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        updateMagLens(cx, cy);
      }

      function onMagEnd(e){
        if (!isMagDragging) return;
        const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

        if (isOverDock(cx, cy)){
          snapMagToDock();
        } else {
          isMagDragging = false;
          magGlass.classList.remove('dragging');
          if (magAddedNoScroll) {
            document.body.classList.remove('no-scroll');
            magAddedNoScroll = false;
          }
        }
      }

      let magScrollQueued = false;
      window.addEventListener('scroll', () => {
        if (!isMagDragging || magScrollQueued) return;
        magScrollQueued = true;
        requestAnimationFrame(() => {
          refreshMagView();
          magScrollQueued = false;  
        });
      }, {passive:true});

      magGlass.addEventListener('mousedown', startMagDrag);
      magGlass.addEventListener('touchstart', startMagDrag, {passive:false});
      document.addEventListener('mousemove', onMagMove);
      document.addEventListener('touchmove', onMagMove, {passive:false});
      document.addEventListener('mouseup', onMagEnd);
      document.addEventListener('touchend', onMagEnd, {passive:true});

      const _origOpenBook = openBook;
      openBook = function(book){
        _origOpenBook(book);
        if (isMagDragging) setTimeout(refreshMagView, 120);
      };

      if ('scrollrestoration' in history){
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
      if (location.hash)(
        'load', function(){
          window.scrollTo(0, 0);
        }
      );

      function makeTable(opts){
        const {caption = '', columns = [], rows = []} = opts || {};

        const colgroupHTML = columns.some(c => c.width)
        ? `<colgroup>${columns.map(c => `<col${c.width ? ` style="width:${c.width}"` : ''}>`).join('')}</colgroup>`
          : '';
          
          const headHTML = columns.length
          ? `<thead><tr>${columns.map(c => 
            `<th${c.align ? ` data-align="${c.align}"` : ''}>${c.label || ''}</th>`
          ).join('')}</tr></head>`
          : '';

          const bodyHTML = rows.map(row => 
            `<tr>${row.map((cell, i) => {
              const isObj = cell && typeof cell === 'object';
              const value = isObj ? cell.value : cell;
              const align = (isObj && cell.align) || (columns[i] && columns[i].align) || '';
              return `<td${align ? ` data-align="${align}"` : ''}>${value != null ? value : ''}</td>`;
            }).join('')}</tr>`
          ).join('');

          return `<div class="book-table-wrap">
            <table class="book-table">
              ${caption ? `<caption>${caption}</caption>` : ''}
              ${colgroupHTML}
              ${headHTML}
              <tbody>${bodyHTML}</tbody>
              </table>
              </div>`;
      }

        const leafCursorUrl = "data:image/svg+xml," + leafCursorSvg.replace(/#/g, '%23');
        const leafCursorStyle = document.createElement('style');
        leafCursorStyle.textContent = `body, body *  {cursor: url("${leafCursorUrl}") 14 32, auto;}`;
        document.head.appendChild(leafCursorStyle); 

        let leafFanLayer = document.getElementById('leafFanLayer');

          leafFanLayer = document.createElement('div');
          leafFanLayer.id = 'leafFanLayer';

          document.body.appendChild(leafFanLayer);

        const leafColors = ['#6b8e4e', '#7fa65a', '#4f7942'];
        const leafPieceMarkup = `<svg viewBox="0 0 34 46" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 45C5 38 1 24 6 12 9 4 14 1 17 1c3 0 8 3 11 11 5 12 1 26-11 33z" fill="currentColor" opacity="0.95"/>
          <path d="M17 42V4" stroke="#2c1810" stroke-width="1" opacity="0.35"/>
          </svg>`;

          function spawnLeafFan(x, y){
            const dur = 620 + Math.random() * 160; 
            [-34, 0, 34].forEach((baseAngle, idx) => {
              const angle = baseAngle + (Math.random() * 8 - 4);
              const size = 30 + Math.random() * 8;
              const el = document.createElement('div');
              el.className = 'leaf-fan-piece';
              el.style.left = (x - size / 2) + 'px';
              el.style.top = (y - size * 1.35) + 'px';
              el.style.color = leafColors[idx % leafColors.length];
              el.style.setProperty('--fan-angle', angle + 'deg');
              el.style.setProperty('--fan-dur', dur + 'ms');
              el.style.setProperty('--leaf-size', size + 'px');
              el.innerHTML = leafPieceMarkup;
              leafFanLayer.appendChild(el);

              const cleanup = () => {if (el.parentNode) el.remove(); };
              el.addEventListener('animationend', cleanup);
              setTimeout(cleanup, dur + 200);

            if (readerScene.classList.contains('active') && readerScene.contains(e.target)) return;

          (function(){
            const readerScene = document.getElementById('readerScene');
            if (!readerScene) return;

            const flowerSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34' viewBox='0 0 34 34'>"
              +"<g>"
                +"<ellipse cx='17' cy='9' rx='5.5' ry='7.5' fill='%23d4af37' opacity='0.92'/>"
                +"<ellipse cx='17' cy='9' rx='5.5' ry='7.5' fill='%23d4af37' opacity='0.92' transform='rotate(72 17 17)'/>" 
                +"<ellipse cx='17' cy='9' rx='5.5' ry='7.5' fill='%23d4af37' opacity='0.92' transform='rotate(144 17 17)'/>"
                +"<ellipse cx='17' cy='9' rx='5.5' ry='7.5' fill='%23d4af37' opacity='0.92' transform='rotate(216 17 17)'/>"
                +"<ellipse cx='17' cy='9' rx='5.5' ry='7.5' fill='%23d4af37' opacity='0.92' transform='rotate(288 17 17)'/>"
                +"<circle cx='17' cy='17' r='4.6' fill='%23d4af37' stroke='%23e6c86e' stroke-width='0.6'/>"
                +"</g></svg>";

                const flowerCursorUrl = "data:image/svg+xml," + flowerSvg.replace(/#/g, '%23');
                const flowerCursorStyle = document.createElement('style');
                flowerCursorStyle.textContent = `.reader-scene.active, .reader-scene.active * {cursor: url("${flowerCursorUrl}") 17 17, auto;}`;
                document.head.appendChild(flowerCursorStyle);

                let burstLayer = document.getElementById('clickBurstLayer');
                if (!burstLayer) {
                  burstLayer = document.createElement('div');
                  burstLayer.id = 'clickBurstLayer';
                  burstLayer.className = 'click-burst-layer';
                  document.body.appendChild(burstLayer);
                }

                const burstColors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a18cd1', '#ff9f43', '#e6c86e'];
                const butterflyMarkup = `<svg class="bf-svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2">
                  <path class="wing-l" d="M30 34c-8-2-18-8-20-16-1-5 4-8 8-6 5 3 8 10 10 16 1 4 0 6 2 6z"  fill="currentColor" opacity="0.9"/>
                  <path class="wing-l" d="M30 34c-6 2-12 8-14 14-1 4 3 7 7 5 4-2 7-8 7-14 0-3-1-5 0-5z" fill="currentColor" opacity="0.75"/>
                  <path class="wing-r" d="M34 34c8-2 18-8 20-16 1-5-4-8-8-6-5 3-8 10-10 16-1 4 0 6-2 6z" fill="currentColor" opacity="0.9"/>
                  <path class="wing-r" d="M34 34c6 2 12 8 14 14 1 4-3 7-7 5-4-2-7-8-7-14 0-3 1-5 0-5z" fill="currentColor" opacity="0.75"/>
                  <ellipse cx="32" cy="34" rx="1.8" ry="10" fill="#2c1810" stroke="none"/>
                  <circle cx="32" cy="23" r="2.2" fill="#2c1810" stroke="none"/>
                  <path d="M31 22q-3-6-6-8M33 22q3-6 6-8" stroke="currentColor" stroke-width="1" opacity="0.8"/>
                  </svg>`;

                  function buildFlightPath(originX, originY){
                    const mainAngle = Math.random() * Math.PI * 2;
                    const viewSpan = Math.min(window.innerWidth, window.innerHeight);
                    const totalDist = Math.max(260, Math.min(viewSpan * 0.85, 260 + Math.random() * 420));
                    const flutterAmp = 35 + Math.random() * 45;
                    const flutterFreq = 1.5 + Math.random() * 1.5;
                    const phase = Math.random() * Math.PI * 2;
                    const perpAngle = mainAngle + Math.PI / 2;
                    const dirX = Math.cos(mainAngle), dirY = Math.sin(mainAngle);
                    const perpX = Math.cos(perpAngle), perpY = Math.sin(perpAngle);

                    const points = [];
                    const rots = [];
                    [0.06, 0.25, 0.45, 0.65, 0.85, 1].forEach((t, i) => {
                      const progress = t * totalDist;
                      const wave = Math.sin(t * Math.PI * flutterFreq + phase) * flutterAmp * (0.4 + t * 0.6);
                      let px = dirX * progress + perpX * wave;
                      let py = dirY * progress + perpY * wave;

                      px = Math.max(-originX + 20, Math.min(window.innerWidth - originX - 20, px));
                      py = Math.max(-originY + 20, Math.min(window.innerHeight - originY - 20, py));
                      points.push({x: px, y: py});
                      const prev = i === 0 ? {x:0, y:0} : points[i-1];
                      const segAngle = Math.atan2(py - prev.y, px - prev.x) * (180 / Math.PI);
                      rots.push(segAngle + (Math.random() * 20 - 10));
                    });
                    return {points, rots};
                  }
                  function spawnButterflyBurst(x, y){
                    const count = 5 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < count; i++){
                    const dur = 2200 + Math.random() * 1400;
                    const size = 18 + Math.random() * 14;
                    const color = burstColors[Math.floor(Math.random() * burstColors.length)];
                    const {points, rots} = buildFlightPath(x, y);

                    const el = document.createElement('div');
                    el.className = 'click-butterfly';
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    el.style.color = color;
                    el.style.setProperty('--burst-dur', dur + 'ms');
                    el.style.setProperty('--bf-size', size + 'px');
                    el.style.setProperty('--r0', rots[0] + 'deg');
                    points.forEach((p, idx) => {
                      el.style.setProperty(`--p${idx}x`, p.x + 'px');
                      el.style.setProperty(`--p${idx}y`, p.y + 'px');
                      el.style.setProperty(`--r${idx}`, rots[idx] + 'deg');
                    });
                    el.innerHTML = butterflyMarkup;
                    burstLayer.appendChild(el);

                    const cleanup = () => {if (el.parentNode) el.remove(); };
                    el.addEventListener('animationend', cleanup);
                    setTimeout(cleanup, dur + 200);
                  }
                }
                  readerScene.addEventListener('pointerdown', function(e){
                    if (!readerScene.classList.contains('active')) return;
                    spawnButterflyBurst(e.clientX, e.clientY);
          });
        })();



    </script>
  </body>
