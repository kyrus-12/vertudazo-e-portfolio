<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>John Renz I. Vertudazo (e-Portfolio)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --parchment:#f48ed0;
      --parchment-shade:#e6d5b8;
      --parchment-dark:#d4c4a8;
      --ink:#2c1810;
      --ink-soft:#5d4037;
      --ink-faint:#8d6e63;
      --gold:#b8860b;
      --gold-light:#d4af37;
      --gold-pale:#e6c86e;
      --burgundy:#6a1b1b;
      --cover:#2c1810;
      --cover-light:#2e2723;
      --font-display:'Cinzel Decorative', serif;
      --font-title:'Cinzel', serif;
      --font-body:'Cormorant Garamond', serif;
      --font-script:'Tangerine', cursive;
      --page-w:clamp(260px, 33vw, 420px);
      --page-h:clamp(420px, 82vh, 640px);
    }
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#1a0f0a;
      font-family:var(--font-body);
      color:var(--ink);
    }
    .bookshelf-scene{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(62,39,35,0.5) 0% transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(44,24,16,0.6) 0% transparent 50%),
        linear-gradient(180deg, #1a0f0a 0%, #2c1810 40%, #1a0f0a 100%);
      position:relative;
      transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
    }
    .bookshelf-scene.hidden{
      opacity:0;
      pointer-events:none;
      transform:scale(0.92);
      filter:blur(8px);
    }
    .bookshelf-scene::before{
      content:'';
      position:absolute;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity:0.4;
      pointer-events:none;
    }
    .shelf-header{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-header h1{
      font-family:var(--font-display);
      font-size:clamp(28px, 5vw, 48px);
      color:var(--gold-pale);
      letter-spacing:0.1em; 
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      text-align:center;
    }
    .shelf-header p{
      font-family:var(--font-script);
      font-size:clamp(22px, 2.5vw, 34px);
      color:var(--gold-light);
      margin-top:4px;
    }
    .shelf-container{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
      max-width:min(95vw, 1100px);
      width:100%;
      padding:0 20px;
    }
    .shelf-row{
      position:relative;
      width:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:clamp(8px, 2vw, 24px);
      padding:20px 30px 14px;
      background:
        linear-gradient(180deg, rgba(62,39,35,0) 0%, rgba(62,39,35,0.4) 100%),
        linear-gradient(90deg, #3e2723 0%, #5d4037 20%, #4e342e 50%, #5d4037 80%, #3e2723 100%);
      border-radius:4px;
      box-shadow:inset 0 4px 8px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.5);
    }
    .shelf-row{
      position:relative;
      width:100%;
      display:flex;
      align-items:flex-end; 
      justify-content:center;
      gap:clamp(8px, 2vw, 24px);
      background:
        linear-gradient(180deg, rgba(62,39,35,0) 0%, rgba(62,39,35,0.4) 100%),
        linear-gradient(90deg, #3e2723 0%, #5d4037 20%, #4e342e 50%, #5d4037 80%, #3e2723 100%);
      border-radius:4px;
      box-shadow:inset 0 4px 8px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.5);
    }
    .shelf-row::after{
      content:'';
      position:absolute;
      bottom:-10px;
      left:0;
      right:0;
      height:10px;
      background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 100%);
      border-radius:0 0 4px 4px;
    }
    .book-spine{
      position:relative;
      width:clamp(44px, 8vw, 72px);
      height:clamp(160px, 28vh, 260px);
      border-radius:3px 3px 0 0;
      cursor:pointer;
      transform-origin:bottom center;
      transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 6px 10px;
      text-align:center;
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.1), inset -2px 0 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.3);
      overflow:hidden;
    }
    .book-spine::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine::after{
      content:'';
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:2px;
      height:100%;
      background:linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.15) 100%);
      pointer-events:none;
      z-index:2;
    }
    .book-spine:hover{
      transform:translateY(-18px) scale(1.05);
      box-shadow:inset 2px 0 4px rgba(255,255,255,0.12), inset -2px 0 4px rgba(0,0,0,0.15), 0 18px 40px rgba(0,0,0,0.5);
      filter:brightness(1.15);
      z-index:10;
    }
    .book-spine:active{
      transform:translateY(-10px) scale(1.02);
    }
    .spine-episode{
      font-family:var(--font-title);
      font-size:clamp(8px, 1.2vw, 11px);
      letter-spacing:0.15em;
      text-transform:uppercase;
      opacity:0.85;
      margin-bottom:8px;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex-shrink:0;
    }
    .spine-title{
      font-family:var(--font-display);
      font-size:clamp(11px, 1.8vw, 16px);
      font-weight:700;
      writing-mode:vertical-rl;
      text-orientation:mixed;
      flex:1;
      display:flex;
      align-items:center;
      line-height:1.3;
      text-shadow:0 1px 3px rgba(0,0,0,0.4);
    }
    .spine-ornament{
      font-size:14px;
      margin-top:auto;
      opacity:0.7;
    }
    .spine-band{
      position:absolute;
      left:0;
      right:0;
      height:3px;
      background:rgba(255,255,255,0.15);
    }
    .spine-band.top{
      top:28px;
    }
    .spine-band.bottom{
      bottom:28px;
    }
    .palette-classic{
      background:linear-gradient(90deg, #3e2723, #5d4037, #3e2723);
      color:#e6c86e;
      border:1px solid #5d4037;
    }
    .palette-ocean{
      background:linear-gradient(90deg, #0a2540, #154360, #0a2540);
      color:#7fdbda;
      border:1px solid #1a5276;
    }
    .palette-forest{
      background:linear-gradient(90deg, #1b4332, #2d6a4f, #1b4332);
      color:#d8f3dc;
      border:1px solid #40916c;
    }
    @keyframes fadeInDown{
      from{ opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);}
    }
    @keyframes fadeInUp{
      from{ opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);}
    }
    .book-spine{
      animation:fadeInUp 0.7s ease backwards;
    }
    .reader-scene{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(62,39,35,0.6) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 30%, rgba(93,64,55,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(44,24,16,0.8) 0%, transparent 50%),
        linear-gradient(135deg, #2c1810 0%, #1a0f0a 50%, #2c1810 100%);
      opacity:0;
      pointer-events:none;
      transform:scale(1.08);
      transition:opacity 0.6s ease, transform 0.6s cubic-bezier(0.25,1,0.5,1);
      z-index:100;
    }
    .reader-scene.active{
      opacity:1;
      pointer-events:auto;
      transform:scale(1);
    }
    .reader-scene::before{
      content:'';
      position:absolute;
      inset:0;
      /* background-image: */
      opacity:0.5;
      pointer-events:none;
    }
    .close-shelf-btn{
      position:fixed;
      top:18px;
      left:18px;
      z-index:3000;
      font-family:var(--font-title);
      font-size:12px;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:var(--gold-pale);
      background:rgba(26,15,10,0.7);
      border:1px solid rgba(212,175,55,0.3);
      padding:8px 16px;
      border-radius:20px;
      cursor:pointer;
      backdrop-filter:blur(6px);
      transition:all 0.25s ease; 
      opacity:0;
      pointer-events:none;
    }
    .close-shelf-btn.visible{
      opacity:1;
      pointer-events:auto;
    }
    .close-shelf-btn:hover{
      background:rgba(212,175,55,0.15);
      border-color:var(--gold);
      color:var(--gold-light);
    }
    
      
      
      
      
    
        
  </style>
  </head>
  
  <body>
    
    <div class="bookshelf-scene" id="bookshelfScene">
      <div class="shelf-header">
        <h1>John Renz I. Vertudazo <br> (e-Portfolio)</h1>
        <p>Choose a book to begin</p>
      </div>
      <div class="shelf-container">
        <div class="shelf-row" id="shelfRow1"></div>
        <div class="shelf-row" id="shelfRow2"></div>
      </div>
    </div>

    <div class="reader-scene" id="readerScene">
      <div class="book-wrap">
        <div class="base-left"></div>
        <div class="spine-shadow"></div>
        <div class="book" id="book"></div>
      </div>
      <div class="hint" id="hint">Swipe to turn a page.</div>
      <div class="controls">
        <button class="ctrl-btn" id="btnPrev" aria-label="Previous page">⬅️</button>
        <span class="page-indicator" id="pageIndicator">Cover</span>
        <button class="ctrl-btn" id="btnNext" aria-label="Next page">➡️</butotn>
      </div>
    </div>

    <button class="close-shelf-btn" id="closeShelfBtn">🔄 Restart</button>
    <div id="measure-container"></div>
